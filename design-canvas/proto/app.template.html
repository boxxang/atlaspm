<meta charset="utf-8">
<title>AtlasPM Prototype</title>
<style>
:root{
  --bg:#ffffff; --sunken:#fbfbfc; --hover:#f7f7f8; --muted:#f1f1f4; --shade:#eceef0;
  --ink:#16181d; --ink-body:#3f434b; --ink-2:#62666d; --ink-3:#8b8f98; --ink-4:#b4b7bd;
  --line-soft:#f0f0f2; --line:#e6e8eb; --line-strong:#d8dade;
  --accent:#5b5bd6; --accent-hov:#4747b8; --accent-soft:#eeeefb; --accent-wash:#f7f7fe; --accent-line:#cdcdf5;
  --risk:#e5484d; --risk-ink:#c5303a; --risk-soft:#fdeced; --risk-wash:#fffafa; --risk-line:#f5cfd0;
  --warn:#f5a524; --warn-soft:#fef7e6; --warn-ink:#8a6a1f;
  --ok:#30a46c; --ok-soft:#e6f6ed;
  --st-done:#d8dade; --st-run:#a8adb6; --st-risk:#e5484d; --st-risk-fut:#f3b9bb; --st-future:#eceef0;
  --r-sm:5px; --r:6px; --r-lg:8px;
  --sh:0 1px 2px rgba(16,24,40,.04);
  --sh-pop:0 8px 28px rgba(16,24,40,.14);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:14px; letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
ul,ol{list-style:none}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hov)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--accent-soft)}

/* ── shell ───────────────────────────────────────── */
#app{display:flex;height:100vh;overflow:hidden}
#side{width:232px;flex-shrink:0;background:var(--sunken);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px;overflow-y:auto}
#main{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.hd{height:48px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px}
.hd h1{font-size:15px;font-weight:600}
.body{flex-grow:1;display:flex;min-height:0}
.scroll{flex-grow:1;overflow-y:auto;min-width:0}

/* ── sidebar ─────────────────────────────────────── */
.brand{display:flex;align-items:center;gap:9px;padding:5px 9px 5px 6px;border-radius:var(--r);width:100%;text-align:left}
.brand:hover{background:var(--hover)}
.mark{width:22px;height:22px;border-radius:var(--r);background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.search{display:flex;align-items:center;gap:8px;height:29px;padding:0 9px;margin-top:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink-3);font-size:12.5px}
.sec{font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);padding:0 9px;margin:16px 0 5px}
.nav{display:flex;align-items:center;gap:9px;height:29px;padding:0 9px;border-radius:var(--r);font-size:13px;color:var(--ink-2);width:100%;text-align:left}
.nav:hover{background:var(--hover);color:var(--ink)}
.nav.on{background:var(--accent-soft);color:var(--ink);font-weight:550}
.nav .g{flex-grow:1}
.nav .c{font-size:11px;color:var(--ink-4)}
.nav .cr{font-size:11px;font-weight:600;color:#fff;background:var(--risk);padding:1px 6px;border-radius:9px}
.substage{display:flex;align-items:center;gap:8px;height:25px;padding:0 9px;font-size:12.5px;color:var(--ink-2);border-radius:var(--r);width:100%;text-align:left}
.substage:hover{background:var(--hover)}
.substage.on{background:var(--accent-soft);color:var(--ink);font-weight:550}
.side-foot{border-top:1px solid var(--line);padding-top:9px;margin-top:auto}

/* ── atoms ───────────────────────────────────────── */
.pill{font-size:11px;padding:2px 7px;border-radius:var(--r-sm);background:var(--muted);color:var(--ink-2);font-weight:500;white-space:nowrap}
.pill.risk{background:var(--risk-soft);color:var(--risk-ink);font-weight:600}
.pill.acc{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink);font-weight:600}
.ref{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r);font-size:12.5px;background:var(--bg);box-shadow:var(--sh);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.pri:hover{background:var(--accent-hov)}
.btn.sm{height:26px;font-size:12px}
.btn.on{background:var(--muted);border-color:var(--line-strong)}
.btn.on{background:var(--muted);font-weight:550}
.av{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#fff;flex-shrink:0}
.av.s{width:18px;height:18px;font-size:8px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg);box-shadow:var(--sh)}
.cap{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.4px;text-transform:uppercase}
.subcap{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tabs{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.tab{padding:0 12px;height:32px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);border-radius:var(--r)}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--muted);color:var(--ink);font-weight:550}
.crumb{font-size:13px;color:var(--ink-3)}
.crumb.sep{color:var(--line-strong)}
.mono-note{font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:56px 40px;color:var(--ink-3);text-align:center}

/* ── step segments ───────────────────────────────── */
.seg{display:inline-flex;gap:2px;vertical-align:middle}
.seg i{width:7px;height:9px;border-radius:1.5px;background:var(--st-future);display:block}
.seg i.d{background:var(--st-run)}
.seg i.now{background:var(--accent)}
.seg i.rk{background:var(--risk)}

/* ── tables ──────────────────────────────────────── */
.thead,.trow{display:grid;align-items:center;gap:11px;padding:0 20px}
.thead{height:30px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.3px}
.trow{min-height:38px;border-bottom:1px solid var(--line-soft);width:100%;text-align:left;font-size:13.5px}
.trow:hover{background:var(--hover)}
.trow.on{background:var(--accent-wash)}
.trow.rk{background:var(--risk-wash)}
.trow.open{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);font-weight:550}
.trow.open:hover{background:var(--accent-soft)}
/* while a set of steps is open, the activities either side step back — the eye should
   land on the one thing that was asked for, not on 16 rows of equal weight */
.ctable.focused > .trow{opacity:.38;transition:opacity .13s}
.ctable.focused > .trow.open,.ctable.focused > .trow:hover{opacity:1}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r{text-align:right}
.groupbar{display:flex;align-items:center;gap:9px;height:34px;padding:0 20px;background:var(--sunken);border-bottom:1px solid var(--line-soft);border-top:1px solid var(--line-soft);width:100%;text-align:left;font-size:12.5px}
.groupbar:hover{background:var(--muted)}

/* ── step rows ─────────────────────────────────────
   Opened steps are a card indented under their activity, on a shaded band, hung off a
   rail that drops from the activity's own chevron — the same move the timeline makes
   when a stage opens. Nothing else on the page is drawn this way, which is the point:
   what was just opened should not read like one more table row. */
.stepwrap,.riskwrap,.notewrap,.delivwrap{position:relative;padding:13px 20px 16px 58px;background:var(--accent-wash);
          border-top:1px solid var(--accent-line);border-bottom:1px solid var(--accent-line)}
.stepwrap::before,.riskwrap::before,.notewrap::before,.delivwrap::before{content:"";position:absolute;left:27px;top:0;bottom:16px;width:2px;border-radius:2px;background:var(--accent-line)}
.stepwrap::after,.riskwrap::after,.notewrap::after,.delivwrap::after{content:"";position:absolute;left:27px;top:29px;width:24px;height:2px;background:var(--accent-line)}
.stepbox,.riskcard,.notecard,.delivcard{border:1px solid var(--accent-line);border-radius:var(--r-lg);overflow:hidden;background:var(--bg);
         box-shadow:0 6px 20px rgba(37,53,110,.10)}
/* the risk thread, at the width of the page rather than of the rail */
.riskcard-hd{display:flex;align-items:center;gap:9px;padding:8px 14px;background:var(--accent-soft);border-bottom:1px solid var(--accent-line)}
.riskcard-body{padding:15px 18px 17px;max-width:980px}
.riskcard-body .post .txt{font-size:14.5px;line-height:1.55}
.riskcard-body .reply .txt{font-size:13.5px}
.riskcard-body .replies{padding-left:18px;gap:13px}
/* ── the key-info board ──────────────────────────
   A note is something someone learned and wrote down. It opens where it sits, reads as
   a page rather than as a row, and carries whatever was attached to it. */
.notecard-hd{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--accent-soft);border-bottom:1px solid var(--accent-line)}
.notecard-hd .btn{flex-shrink:0}
.notecard-body{padding:16px 18px 14px;max-width:900px}
.delivcard .notecard-body{max-width:820px}
.clip{cursor:pointer}
button.clip:hover{background:var(--accent-line)}
/* A long note scrolls inside itself. 416px is about eighteen lines at this measure —
   enough that most notes never scroll at all, and short enough that opening a long one
   still leaves the board underneath it on screen. The fade is added only when there is
   actually more below (see markOverflow), so it never lies about there being more. */
.noteprose-wrap{position:relative}
.noteprose{max-height:416px;overflow-y:auto;overscroll-behavior:contain}
.noteprose-wrap.scrolls .noteprose{padding-right:12px;padding-bottom:16px}
.noteprose-wrap.scrolls::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(255,255,255,0),var(--bg) 78%);transition:opacity .12s}
.noteprose-wrap.scrolls.at-end::after{opacity:0}
.noteprose-text{font-size:14px;line-height:1.62;color:var(--ink-body);white-space:pre-wrap;word-break:break-word}
.notebody{width:100%;min-height:150px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px;line-height:1.6;resize:vertical;background:var(--bg);display:block}
.notebody:focus{outline:none;border-color:var(--accent)}
.noteatt{border-top:1px solid var(--line-soft);margin-top:15px;padding-top:12px}
.thumb{width:40px;height:40px;border-radius:var(--r-sm);overflow:hidden;flex-shrink:0;border:1px solid var(--line);display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.steprow{display:grid;align-items:center;gap:10px;min-height:37px;padding:0 14px;border-bottom:1px solid var(--line-soft);background:var(--bg);font-size:13px}
.steprow.hdr{min-height:28px;background:var(--accent-soft);border-bottom-color:var(--accent-line);font-size:10.5px;font-weight:600;color:var(--accent-hov);letter-spacing:.3px}
.steprow.rk{background:var(--risk-soft);border-bottom-color:var(--risk-line)}
.steprow.last{border-bottom:none}
.cb{width:15px;height:15px;border-radius:4px;border:1.5px solid #c4c8d4;flex-shrink:0;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;padding:0}
.cb:hover{border-color:var(--accent)}
.cb.on{background:var(--accent);border-color:var(--accent)}
.par{padding-left:16px;position:relative}
.par::before{content:"\2016";position:absolute;left:0;color:var(--ink-4);font-size:11px}
.stepclick{cursor:pointer}
.steprow.stepclick:hover{background:var(--accent-wash)}
/* colour and the bar carry the selection; bolding the row rewraps the date column and
   the row changes height as you click down the list */
.steprow.sel,.steprow.sel.stepclick:hover{background:#d6e0ff;box-shadow:inset 3px 0 0 var(--accent)}
.steprow.sel.rk,.steprow.sel.rk.stepclick:hover{background:#fad8d9;box-shadow:inset 3px 0 0 var(--risk)}
.clip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 5px;vertical-align:1px}

/* ── peek panel ──────────────────────────────────── */
#peek{width:400px;flex-shrink:0;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg);min-height:0}
.peek-hd{height:44px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 16px}
.peek-body{flex-grow:1;overflow-y:auto;padding:15px 16px 20px}
.peek-foot{border-top:1px solid var(--line);padding:11px 16px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.prop{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:10px;padding:5px 0}
.pk{font-size:12.5px;color:var(--ink-3)}
.post{display:flex;gap:10px;margin-bottom:15px}
.post .who{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.post .txt{font-size:13.5px;line-height:1.5;margin-top:4px}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
/* only the post or reply actually under the cursor shows its controls */
.post:hover > div > .who .acts,.reply:hover .acts,.feedrow:hover .acts,.acts:focus-within{opacity:1}
.acts button{font-size:11.5px;color:var(--ink-3);padding:1px 5px;border-radius:4px}
.acts button:hover{color:var(--accent);background:var(--accent-soft)}
.acts button.del:hover{color:var(--risk-ink);background:var(--risk-soft)}
.edited{font-size:11px;color:var(--ink-4);font-style:italic}
.delconf{display:flex;align-items:center;gap:8px;margin-top:6px;padding:7px 10px;border:1px solid var(--risk-line);background:var(--risk-soft);border-radius:var(--r);font-size:12.5px;color:var(--risk-ink)}
/* ── replies ─────────────────────────────────────
   Hung off a rail and set in from the post they answer, so a thread reads as one
   exchange instead of as several unrelated updates. */
.replies{margin:10px 0 2px;padding-left:16px;border-left:2px solid var(--accent-line);display:flex;flex-direction:column;gap:11px}
/* each reply is tied back to the rail, the same elbow the open steps hang from */
.reply{display:flex;gap:8px;position:relative}
.reply::before{content:"";position:absolute;left:-16px;top:10px;width:10px;height:2px;background:var(--accent-line)}
.addreply{position:relative}
.addreply::before{content:"";position:absolute;left:-16px;top:9px;width:10px;height:2px;background:var(--accent-line)}
.reply .who{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.reply .txt{font-size:13px;line-height:1.5;margin-top:3px;color:var(--ink-body)}
.addreply{align-self:flex-start;font-size:11.5px;color:var(--accent);font-weight:550}
.addreply:hover{color:var(--accent-hov)}
.btn.dng{color:var(--risk-ink);border-color:var(--risk-line);background:var(--risk-soft)}
.btn.dng:hover{background:#fbdcdd}
.composer{border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden;flex-grow:1}
.composer textarea{width:100%;border:none;padding:9px 11px;font-size:13px;resize:none;min-height:56px;display:block;background:transparent}
.composer textarea:focus{outline:none}
.composer .bar{display:flex;align-items:center;gap:7px;padding:7px 9px;border-top:1px solid var(--line-soft);background:var(--sunken)}
.stepsel{font-size:11.5px;font-weight:550;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:2px 8px;border-radius:var(--r-sm)}

/* ── outputs menu + attachments ──────────────────── */
.menu{position:relative}
.menu-pop.left{right:auto;left:0}
/* ── dialogs and the communication board ─────────
   Lifted from the app's globals.css so the two cannot drift. */
.dlg{inset:0;margin:auto;width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 64px);padding:0;border:none;
  border-radius:var(--r-lg);background:var(--bg);color:var(--ink);box-shadow:var(--sh-pop);
  display:flex;flex-direction:column;overflow:hidden}
.dlg::backdrop{background:rgba(16,24,40,.32);backdrop-filter:blur(2px)}
.dlg-hd{display:flex;align-items:center;gap:9px;padding:12px 16px;background:var(--sunken);
  border-bottom:1px solid var(--line);flex-shrink:0}
.dlg-body{padding:4px 18px 8px;overflow-y:auto;display:flex;flex-direction:column}
.dlg-foot{display:flex;align-items:center;gap:8px;padding:11px 16px;background:var(--sunken);
  border-top:1px solid var(--line);flex-shrink:0}
.dlg-field{display:block;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.dlg-field:last-child{border-bottom:none}
.dlg-label{display:block;font-size:12.5px;font-weight:600}
.dlg-hint{display:block;font-size:11.5px;line-height:1.45;color:var(--ink-3);margin-top:2px;
  max-width:64ch}
.dlg-control{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:8px}
.post-head{display:flex;gap:11px;align-items:flex-start;padding:14px 0 10px;border-bottom:1px solid var(--line-soft)}
.post-body-txt{margin:11px 0 4px;font-size:13.5px;line-height:1.6;color:var(--ink);
  white-space:pre-wrap;overflow-wrap:break-word;max-width:74ch}
.board-comments{display:flex;flex-direction:column;gap:13px;margin-top:9px}
.board-comment{display:flex;gap:9px;align-items:flex-start}
.board-comment .post-body-txt{font-size:13px;margin:3px 0 0;color:var(--ink-2)}
.board-comment-acts{display:flex;gap:11px;margin-top:4px}
.board-comment-acts button{background:none;border:none;padding:0;cursor:pointer;
  font-size:11.5px;color:var(--ink-3);font-family:inherit}
.board-comment-acts button:hover{color:var(--ink)}
.board-comment-acts button.dng:hover{color:var(--risk)}
.cbx{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;margin:3px 0 0}
.menu-pop{position:absolute;right:0;top:calc(100% + 5px);z-index:20;min-width:224px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-pop);padding:5px}
.mi{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:var(--r-sm);font-size:12.5px;text-align:left;width:100%}
.mi:hover{background:var(--accent-wash)}
.mi svg{flex-shrink:0;margin-top:1px}
.mi .d{font-size:11px;color:var(--ink-4);display:block;margin-top:2px;line-height:1.35}
.att{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.att .ic{width:26px;height:26px;border-radius:var(--r-sm);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.att .x{font-size:13px;color:var(--ink-4);flex-shrink:0;line-height:1;padding:2px}
.att .x:hover{color:var(--risk)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;background:var(--muted);outline:none;cursor:pointer;display:block}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 1px 3px rgba(16,24,40,.32);cursor:pointer}
.rng::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:pointer}
.lnkin{flex-grow:1;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 9px;font-size:12.5px;min-width:0;background:var(--bg)}
.lnkin:focus{outline:none;border-color:var(--accent)}
.dateinp{font-size:12.5px;border:1px solid var(--line);border-radius:var(--r-sm);padding:3px 6px;background:var(--bg);color:inherit;font-family:var(--sans);min-width:0}
.dateinp:focus{outline:none;border-color:var(--accent)}
.dateinp.late{border-color:var(--risk-line);color:var(--risk-ink)}
.ownersel{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px 6px;min-width:0;flex-grow:1}
.ownersel:focus{outline:none;border-color:var(--accent)}
.pickrow{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:var(--r-sm);width:100%;text-align:left;font-size:12.5px}
.pickrow:hover{background:var(--accent-wash)}

/* ── timeline ────────────────────────────────────── */
.tl-grid{display:grid;grid-template-columns:330px 1fr}
/* Row height is a display setting, so every part of a row measures itself from one
   variable rather than from numbers scattered through the stylesheet. */
.tl{--tlh:26px;--tlb:10px;--dia:27px;--diaf:8px}
.tl-row{display:grid;grid-template-columns:330px 1fr;min-height:var(--tlh);align-items:center;border-bottom:1px solid var(--hover);width:100%;text-align:left}
.tl-row:hover{background:var(--hover)}
.tl-row.on{background:var(--accent-wash)}
.tl-name{display:flex;align-items:center;gap:8px;padding-left:30px;min-width:0}
.tl-lane{position:relative;height:var(--tlh);margin-right:20px}
.tl-bar{position:absolute;top:calc((var(--tlh) - var(--tlb)) / 2);height:var(--tlb);border-radius:3px}
.tl-ph{display:grid;grid-template-columns:330px 1fr;height:25px;align-items:center;background:var(--hover);border-top:1px solid var(--line);border-bottom:1px solid var(--line-soft)}
.today-line{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);z-index:3;pointer-events:none}
.tl-head{display:grid;grid-template-columns:330px 1fr;align-items:center;min-height:28px;background:#eef0fb;border-bottom:1px solid var(--accent-line)}
.tl-head .nm{position:relative;padding-left:30px;display:flex;align-items:center;gap:8px;min-width:0;align-self:stretch}
.tl-head .nm::before{content:"";position:absolute;left:40px;top:18px;bottom:-1px;width:1px;background:var(--accent-line)}
.tl-sub{display:grid;grid-template-columns:330px 1fr;min-height:var(--tlh);align-items:center;background:#f8f9fd;border-bottom:1px solid #eef0f6;width:100%;text-align:left}
.tl-sub:hover{background:#eef2fd}
.tl-sub:last-of-type{border-bottom:1px solid var(--accent-line)}
.tl-sub .nm{display:flex;align-items:center;gap:7px;padding-left:58px;min-width:0;position:relative;align-self:stretch}
.tl-sub .nm::before{content:"";position:absolute;left:40px;top:-1px;bottom:-1px;width:1px;background:var(--accent-line)}
.tl-sub .lane{position:relative;height:var(--tlh);margin-right:20px}
.tl-sub .b{position:absolute;top:calc((var(--tlh) - var(--tlb) + 2px) / 2);height:calc(var(--tlb) - 2px);border-radius:2px}

/* ── reading page ────────────────────────────────── */
.read{flex:1 1 auto;min-width:0;max-width:760px;padding:26px 40px 60px}
.read h1{font-size:26px;font-weight:600;letter-spacing:-.025em;line-height:1.25;margin:12px 0 0;text-wrap:balance}
.read h2{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
.read p{font-size:15px;line-height:1.65;color:var(--ink-body);margin:0 0 12px}
.read .sec-b{margin-top:26px}
.li{display:flex;gap:10px;align-items:baseline;padding:5px 0;font-size:14.5px;color:var(--ink-body)}
.rail{width:300px;flex-shrink:0;padding:26px 20px 40px;overflow-y:auto}

/* ── stat cards ──────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stat{padding:13px 15px}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-top:7px;font-variant-numeric:tabular-nums}
.stat .s{font-size:11.5px;color:var(--ink-3);margin-top:7px}
.bar{height:4px;background:var(--muted);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:4px;border-radius:3px;background:var(--accent)}

.seg-ctl{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);height:28px}
.seg-ctl > *{padding:0 11px;display:flex;align-items:center;font-size:12.5px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg-ctl > *:last-child{border-right:none}
.seg-ctl > .on{background:var(--muted);color:var(--ink);font-weight:550}
.chips{height:38px;flex-shrink:0;display:flex;align-items:center;gap:7px;padding:0 20px;border-bottom:1px solid var(--line-soft)}
/* the same rail and elbows the panels use, one size down for a list */
.xreplies{margin-top:9px;gap:8px}
.xreplies .txt{font-size:12.5px;margin-top:2px}
.xtable .chead > span{text-align:center}
.xtable .chead > span:nth-child(3){text-align:left}
.xtable .chead > span:nth-child(7){text-align:left}
.chip{font-size:12.5px;padding:3px 10px;border-radius:var(--r);color:var(--ink-2)}
button.chip:hover{background:var(--muted)}
.chip.on,button.chip.on:hover{background:var(--ink);color:#fff;font-weight:500}
.ctable .thead,.ctable .trow{grid-template-columns:var(--ct)}
.stepbox .steprow{grid-template-columns:var(--ct)}
.colgrip{position:absolute;right:-6px;top:-7px;bottom:-7px;width:11px;cursor:col-resize;z-index:2}
.colgrip::after{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:transparent}
.colgrip:hover::after,.colgrip.on::after{background:var(--accent)}
body.coldrag{cursor:col-resize;user-select:none}
.filterbar{height:38px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg)}
.tip{position:absolute;z-index:6;background:var(--ink);color:#fff;border-radius:7px;padding:8px 11px;box-shadow:var(--sh-pop);white-space:nowrap;pointer-events:none}
.grip{position:absolute;top:calc((var(--tlh) - var(--tlb)) / 2);width:3px;height:var(--tlb);background:var(--accent);border-radius:2px}
/* ── checkpoints above the chart ─────────────────
   Every milestone is named, and the labels are dealt into as many lanes as it takes for
   none to sit on another (see layoutMilestones). The big ones drop a line through the
   bars so you can see which stages they land on. */
/* What rides at the end of a bar: the checkpoint that stage's end date IS, and how many
   risks are open on it. One element, so the two can never land on top of each other. */
.tl-tail{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:8px;white-space:nowrap;pointer-events:none}
/* written leftwards, with the diamond moved to the trailing edge so it still lands
   against the bar end it marks */
.tl-tail.flip{transform:translateX(calc(-100% - 18px))}
.tl-tail.flip .ms-chip .dia{order:3}
.ms-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
/* The date sits inside the diamond. A square rotated 45 degrees is widest along its
   centre line — a24px box spans 34px there — which is where the text is, so MM/DD fits
   without the marker growing taller than the row it belongs to. */
.ms-chip .dia{width:var(--dia);height:var(--dia);margin:0 5px;transform:rotate(45deg);flex-shrink:0;
  border:1.5px solid var(--ink-3);background:var(--bg);border-radius:3px;
  display:flex;align-items:center;justify-content:center}
.ms-chip .dia b{transform:rotate(-45deg);font-size:var(--diaf);font-weight:600;line-height:1;
  white-space:nowrap;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ms-chip .dd{color:var(--ink-4);font-variant-numeric:tabular-nums;font-size:11px}
.ms-chip.major{font-size:13px;font-weight:600;color:var(--accent-hov)}
.ms-chip.major .dia{background:var(--accent-soft);border-color:var(--accent);border-width:2px}
.ms-chip.major .dia b{color:var(--accent-hov)}
.ms-chip.major .dd{color:var(--accent);font-weight:400;font-size:11.5px}
.rk-chip{font-size:10.5px;color:var(--risk)}
.ms-guide{position:absolute;top:0;bottom:0;width:1px;background:var(--accent-line);z-index:1;pointer-events:none}
.lane-d{border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 15px;background:var(--sunken);margin-bottom:14px}
.lane-b{position:absolute;height:18px;border-radius:4px;font-size:10.5px;display:flex;align-items:center;padding-left:7px}
/* ── the stage dashboard ─────────────────────────
   Where a stage stands, before you have opened a single tab. */
.sdash{display:flex;flex-wrap:wrap;align-items:stretch;margin-top:15px;overflow:hidden}
.dstat{padding:11px 17px;border-right:1px solid var(--line-soft);text-align:left;flex:0 0 auto;min-width:126px}
.dstat.go:hover{background:var(--hover)}
.dstat .dbar{margin-top:7px;width:72px}
.sdash-pace{flex:1 1 300px;padding:11px 18px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:280px}
/* one bar, two facts: how much of the work is done, and where the calendar has got to */
.pacebar{position:relative;height:8px;background:var(--muted);border-radius:4px;display:block}
.pacebar > i{display:block;height:8px;border-radius:4px;background:var(--accent)}
.pacebar > b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.pacekey{display:flex;align-items:center;gap:13px;font-size:11px;color:var(--ink-3)}
.pacekey span{display:inline-flex;align-items:center;gap:5px}
.pacekey i{width:9px;height:8px;border-radius:2px;display:inline-block}
.prev-sec{padding:16px 20px;border-bottom:1px solid var(--line)}
.attn{display:grid;grid-template-columns:112px 96px 1fr 148px 96px 150px;align-items:start;gap:12px;padding:11px 18px;
  border-bottom:1px solid var(--line-soft);width:100%;text-align:left}
/* eight rows before it starts scrolling: enough to read the top of the list without the
   card eating the page, and nothing is cut off from being reached */
.attn-list{max-height:432px;overflow-y:auto;overscroll-behavior:contain}
.attn.hdr{padding-top:7px;padding-bottom:7px;background:var(--sunken);border-bottom:1px solid var(--line);align-items:center;
  font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.3px}
.attn.hdr:hover{background:var(--sunken)}
.attn:hover{background:var(--hover)}
.attn:last-child{border-bottom:none}
.ms-row{display:grid;grid-template-columns:206px 1fr 86px 60px;gap:10px;align-items:center;min-height:24px;width:100%;text-align:left;border-radius:4px}
.ms-row:hover{background:var(--hover)}
#scrim{position:fixed;inset:0;background:rgba(16,24,40,.28);display:flex;justify-content:center;padding-top:12vh;z-index:50}
#pal{width:min(680px,92vw);max-height:70vh;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 64px rgba(16,24,40,.24);display:flex;flex-direction:column;overflow:hidden}
#pal .top{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
#pal input{flex-grow:1;border:none;font-size:15px;background:transparent}
#pal input:focus{outline:none}
#pal .out{overflow-y:auto;padding:6px 0}
#pal .gh{font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);padding:8px 16px 5px}
.pres{display:grid;grid-template-columns:66px 1fr auto;align-items:center;gap:11px;padding:7px 16px;width:100%;text-align:left;font-size:13.5px}
.pres:hover,.pres.cur{background:var(--accent-wash)}
.pres .ctx{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
#pal .foot{border-top:1px solid var(--line);padding:8px 16px;display:flex;gap:14px;font-size:11.5px;color:var(--ink-3)}
kbd{font:inherit;font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2)}
.search{cursor:text}
@media (max-width:1180px){ .stats{grid-template-columns:repeat(3,minmax(0,1fr))} #peek{width:340px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<div id="app">
  <nav id="side" aria-label="Program"></nav>
  <div id="main">
    <div class="hd" id="hd"></div>
    <div class="body">
      <div class="scroll" id="view"></div>
      <aside id="peek" hidden></aside>
    </div>
  </div>
</div>

<script id="d-acts" type="application/json">/*__ACTS__*/</script>
<script id="d-seed" type="application/json">/*__SEED__*/</script>
<script id="d-stg" type="application/json">/*__STG__*/</script>
<script>
"use strict";
const DB = JSON.parse(document.getElementById("d-acts").textContent);
const ACTS = DB.acts;
const DELIV = DB.deliv;
const SEED = JSON.parse(document.getElementById("d-seed").textContent);
const STG = JSON.parse(document.getElementById("d-stg").textContent);

/* ═══ constants ═══════════════════════════════════ */
const PHASES = [
  ["define","Define"],["enable","Technology & IP Enablement"],["designVerify","Design & Verify"],
  ["implement","Implement"],["manufacture","Manufacture"],["integrate","Integrate"],["validateRamp","Validate & Ramp"]
];
const MILESTONES = [
  ["archFreeze","Arch Freeze","architecture",0],["pdk10Release","PDK 1.0 Release","pdk",0],
  ["ipPlanFreeze","IP Plan Freeze","ipReadiness",0],["amsMacroHandoff","AMS Macro Handoff","amsIp",0],
  ["testChipSilicon","Test Chip Silicon","testChip",0],["rtlFreeze","RTL Freeze","rtl",0],
  ["dvClosure","DV Closure","verification",0],["ffnRelease","FFN Release","synthesis",0],
  ["designFreeze","Design Freeze","signoff",0],["tapeoutBeolMto","Tapeout (BEOL MTO)","tapeout",1],
  ["firstSilicon","First Silicon","fabrication",1],["packageDesignFreeze","Package Design Freeze","packageDesign",0],
  ["evbReady","EVB Ready","validationHardware",0],["probeCardReady","Probe Card Ready","testDevelopment",0],
  ["massProduction","Mass Production","qualification",1]
];
const DAY = 864e5;
const TODAY = startOfDay(new Date());
const KICKOFF = new Date(SEED.project.kickoff);   /* keeps its time of day, as the app does */

function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
/* ported from /lib/schedule.ts — calendar arithmetic, so DST never eats a day */
function addW(d, w){ const n = new Date(d); n.setDate(n.getDate() + Math.round(w*7)); return n; }
function fmt(d){ if(!d) return "—"; const p=n=>String(n).padStart(2,"0"); return p(d.getMonth()+1)+"/"+p(d.getDate())+"/"+d.getFullYear(); }
const fmtMD = d => { const p = n => String(n).padStart(2,"0"); return p(d.getMonth()+1)+"/"+p(d.getDate()); };
function fmtShort(d){ if(!d) return "—"; const p=n=>String(n).padStart(2,"0"); return p(d.getMonth()+1)+"/"+p(d.getDate())+"/"+String(d.getFullYear()).slice(2); }
function fmtDT(s){ const d=new Date(s); const p=n=>String(n).padStart(2,"0"); return p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }
/* ported from /lib/derive.ts — whole days, rounded up, against the real clock */
function daysTo(d){ return Math.ceil((d.getTime() - Date.now()) / DAY); }
function dday(d){ if(!d) return ""; const n = daysTo(d); return n >= 0 ? "D−"+n : "D+"+Math.abs(n); }
function rich(s){ return esc(String(s==null?"":s)).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function initials(n){ return String(n||"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?"; }
const AVC = ["#5b5bd6","#d6624a","#3d7f6e","#8b6cc9","#b07d2e","#2f6fb8","#a0527a","#4a7f3d"];
function avcolor(n){ let h=0; for(const c of String(n||"")) h=(h*31+c.charCodeAt(0))>>>0; return AVC[h%AVC.length]; }
function av(name, small){ return '<span class="av'+(small?" s":"")+'" style="background:'+avcolor(name)+'" title="'+esc(name)+'">'+esc(initials(name))+"</span>"; }

/* ═══ local state ═════════════════════════════════ */
const ME = "Sangwook Park";   /* whoever is using the app — everything posted here is theirs */
let INDEX = null;   /* the search index, thrown away by save() whenever content changes */
const LSK = "atlaspm.proto.v2";
let ST = { steps:{}, posts:[], deliv:{}, att:{}, pct:{} };
try { const r = localStorage.getItem(LSK); if(r) ST = Object.assign(ST, JSON.parse(r)); } catch(e){}
/* outputs attached to a step, and the percent someone typed on it — both keyed "ACT-01:3" */
ST.att = ST.att || {}; ST.pct = ST.pct || {}; ST.stepOwner = ST.stepOwner || {}; ST.stepDue = ST.stepDue || {};
/* the team as this programme has edited it: changes to anyone, people added here, and
   people added here and since taken back out */
ST.people = ST.people || {}; ST.newPeople = ST.newPeople || []; ST.gone = ST.gone || {};
/* the key-info board: notes written here, edits to the ones seeded with the programme,
   the ones taken back out, and whatever is attached to each */
ST.tlRow = ST.tlRow || "normal";
ST.notes = ST.notes || []; ST.noteEdits = ST.noteEdits || {}; ST.noteGone = ST.noteGone || {}; ST.noteAtt = ST.noteAtt || {};
/* the communication board: posts written here, edits to the ones seeded with the
   programme, the ones taken back out, and the same three for their comments */
ST.bPosts = ST.bPosts || []; ST.bEdits = ST.bEdits || {}; ST.bGone = ST.bGone || {};
ST.bComments = ST.bComments || []; ST.bCommentEdits = ST.bCommentEdits || {}; ST.bCommentGone = ST.bCommentGone || {};
/* Which post is open, and what is half-typed in it, is where the reader is
   standing rather than anything the programme knows. It is cleared on load: a
   window that reopened itself on every reload would block the page it is on. */
ST.bWin = null; ST.bCommentEditing = null; ST.bCommentDraft = "";
/* what has been handed over for a key deliverable, and what was said about it */
/* One handover post per key deliverable: what was handed over, what came with it, the
   date it was accepted, and the conversation about it. Attachments and comments used to
   be two unrelated lists; a handover is one thing somebody writes. */
ST.delivPost = ST.delivPost || {};
if (ST.delivAtt || ST.delivPosts) {          /* fold the earlier two-list shape into it */
  for (const id of Object.keys(ST.delivAtt || {})) {
    const p = ST.delivPost[id] = ST.delivPost[id] || { id:"dp-"+id, who:ME, at:new Date().toISOString(), text:"", att:[], replies:[] };
    p.att = p.att.concat(ST.delivAtt[id]);
  }
  for (const id of Object.keys(ST.delivPosts || {})) {
    const old = ST.delivPosts[id]; if (!old.length) continue;
    const p = ST.delivPost[id] = ST.delivPost[id] || { id:"dp-"+id, who:old[0].who, at:old[0].at, text:"", att:[], replies:[] };
    p.text = p.text || old[0].text;
    p.replies = p.replies.concat(old.slice(1));
  }
  delete ST.delivAtt; delete ST.delivPosts; save();
}
if (ST.who !== ME) {
  for (const p of ST.posts) if (p.who && p.who !== ME) p.who = ME;
  for (const k of Object.keys(ST.att)) for (const a of ST.att[k]) a.who = ME;
  ST.who = ME; save();
}
const newId = p => p + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36);
/* Posts written before they carried an id get one now, so a thread saved by an earlier
   build is still yours to edit. Seeded posts have none, and stay read-only. */
if (ST.posts.some(p => !p.id)) { let i = 0; for (const p of ST.posts) if (!p.id) p.id = "p0-" + (i++); save(); }
function save(){ INDEX = null; try { localStorage.setItem(LSK, JSON.stringify(ST)); } catch(e){} }

/* ═══ column widths — dragged by the user, remembered per table ═══ */
ST.colw = ST.colw || {};
const cw = (k, def) => ST.colw[k] != null ? ST.colw[k] : def;
/* [key, default px | null for the flexible one, resizable] */
function ctVar(tid, cols){
  return cols.map(([k, def]) => def == null ? "minmax(0,1fr)" : cw(tid+":"+k, def)+"px").join(" ");
}
function cthead(tid, cols, cls){
  return '<div class="'+(cls||"thead")+' chead">'+cols.map(([k, def, label, noGrip]) =>
    '<span style="position:relative">'+esc(label||"")+
    (def == null || noGrip ? "" : '<span class="colgrip" data-colgrip="'+tid+":"+k+'" data-colw="'+cw(tid+":"+k, def)+'"></span>')+
    '</span>').join("")+'</div>';
}
let DRAG = null;
document.addEventListener("pointerdown", e => {
  const g = e.target.closest("[data-colgrip]"); if (!g) return;
  e.preventDefault(); e.stopPropagation();
  const box = g.closest(".ctable");
  DRAG = { key:g.getAttribute("data-colgrip"), from:e.clientX, w0:+g.getAttribute("data-colw"), box, grip:g,
           tpl:getComputedStyle(box).getPropertyValue("--ct").trim().split(/\s+(?![^(]*\))/),
           fixed: getComputedStyle(box).getPropertyValue("--ct").trim().split(/\s+(?![^(]*\))/)
                    .map(v => /^[\d.]+px$/.test(v) ? parseFloat(v) : null) };
  g.classList.add("on"); document.body.classList.add("coldrag");
  g.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove", e => {
  if (!DRAG) return;
  const w = Math.max(34, Math.min(520, DRAG.w0 + (e.clientX - DRAG.from)));
  ST.colw[DRAG.key] = Math.round(w);
  /* rewrite only the one track, so the drag stays smooth and nothing re-renders */
  const cols = [...DRAG.box.querySelectorAll(".chead > span")];
  const t = cols.map((c, i) => { const g = c.querySelector("[data-colgrip]");
    if (!g) return DRAG.fixed[i] != null ? DRAG.fixed[i]+"px" : "minmax(0,1fr)";
    return (g.getAttribute("data-colgrip") === DRAG.key ? Math.round(w) : +g.getAttribute("data-colw")) + "px"; });
  DRAG.box.style.setProperty("--ct", t.join(" "));
});
document.addEventListener("pointerup", () => {
  if (!DRAG) return;
  DRAG.grip.classList.remove("on"); document.body.classList.remove("coldrag");
  DRAG = null; save(); render();
});

/* ═══ derived model ═══════════════════════════════ */
const STAGES = SEED.stages.map(s => {
  const start = addW(KICKOFF, s.startOffsetWeeks);
  const end = addW(start, s.durationWeeks);
  return Object.assign({}, s, { start, end });
});
const stageBy = Object.fromEntries(STAGES.map(s=>[s.key,s]));
const SPAN_START = KICKOFF;
const SPAN_END = STAGES.reduce((m,s)=> s.end>m ? s.end : m, KICKOFF);
const SPAN = SPAN_END - SPAN_START;
const pct = d => ((startOfDay(d) - SPAN_START) / SPAN) * 100;

/* Steps whose window has closed are ticked, so the app opens on a lived-in programme
   rather than 0 of 1,649 — but a real programme is never that tidy either, and the
   Overdue list needs something to look at.

   Work inside an activity runs in order, so lateness has a shape: an activity STOPS.
   Everything before where it stopped is finished, that step and the ones after it are
   not. An open step sitting in the middle of a finished run — step 1 late while steps
   2 to 8 are complete — is not something that happens, so a handful of activities are
   stalled at their own frontier instead of steps being opened at random.

const SEED_V = 4;
/* Six stalled activities, two late steps each: ten late steps spread over six stages,
   which reads as a programme with a few things stuck rather than one falling apart.
   Spread beats depth here — six stages with a problem each is the picture a TPM has. */
const STALL_ACTS = 6, STALL_DEPTH = 2;
function pickStalls(){
  const out = [];
  for (const st of STAGES) {
    if (TODAY < st.start || TODAY > st.end) continue;         /* only stages in flight */
    /* an activity that is genuinely mid-flight: some of its steps are past, some are not */
    const cands = (actsByStage[st.key] || []).filter(id => {
      const ds = stepDates(id);
      return ds.some(d => d.end < TODAY) && ds.some(d => d.end >= TODAY);
    });
    if (cands.length) out.push(cands[Math.floor(cands.length / 2)]);
    if (out.length >= STALL_ACTS) break;
  }
  return out;
}
if (ST.seeded !== SEED_V) {
  const open = new Set();
  for (const id of pickStalls())
    for (const d of stepDates(id).filter(x => x.end < TODAY).slice(-STALL_DEPTH))
      open.add(id+":"+d.n);
  for (const id of Object.keys(ACTS)) for (const d of stepDates(id)) {
    if (d.end >= TODAY) continue;
    const key = id+":"+d.n, cur = ST.steps[key];
    if (cur && !cur.auto) continue;                 /* set by hand — not ours to move */
    if (open.has(key)) { delete ST.steps[key]; continue; }
    ST.steps[key] = { done:true, at:d.end.toISOString(), auto:true };
  }
  ST.seeded = SEED_V; save();
}
const stepDone = (id,n) => !!(ST.steps[stepKey(id,n)] && ST.steps[stepKey(id,n)].done);

/* When it was finished: the moment the output was handed over, or whatever has since

function stageDoneAt(key){

function stepLate(id,n){ const d = stepDueDate(id,n); return !stepDone(id,n) && !!d && startOfDay(d) < TODAY; }

const stepPct = (id,n) => stepDone(id,n) ? 100 : (ST.pct[stepKey(id,n)] || 0);

/* everyone on the programme, one entry per person, for the pickers */

/* ── the seeded risks become posts on the step they are about ────────
   A risk was written against a stage, but a stage is 8 to 16 activities long and
   nobody works on a stage — they work on a step. Score each risk's wording against
   every step of the stage (the step's own text and what it hands over, with the
   activity title counting for less) and post it on the step that answers it. Where the
   wording lines up with nothing it goes on the step the stage is actually working on:
   a risk still has to sit somewhere a PM can act on it. Below CONFIDENT the match is
   shown as inferred rather than passed off as certain.
   Once moved they are ordinary posts — mine to edit, answer and clear — so this runs
   once and is remembered. It runs at the end of the script, where the word helpers and
   the step dates it needs are already defined. */
const CONFIDENT = 0.25;
function migrateRisks(){
  if (ST.risksMigrated) return;
  for (const it of SEED.items) {
    if (it.kind !== "risk" || it.done) continue;
    const b = matchRiskToStep(it);
    if (!b) continue;
    ST.posts.push({ id:newId("p"), act:b.act, stepN:b.n, risk:true,
                    text: it.title + (it.body ? " — " + it.body : ""),
                    who:ME, at:it.updatedAt,
                    fromItem:it.id, inferred: b.score < CONFIDENT });
  }
  ST.risksMigrated = true; save();
}
function matchRiskToStep(it){
  const acts = actsByStage[it.stageId] || [];
  if (!acts.length) return null;
  const rw = words(it.title + " " + (it.body || ""));
  let best = null;
  for (const id of acts) {
    const a = ACTS[id], aw = words(a.t);
    for (const sp of a.s) {
      const n = sp[0], sw = words(sp[1] + " " + (a.p[n-1] || ""));
      let sum = 0;
      for (const w of rw) sum += sw.includes(w) ? 1 : aw.includes(w) ? 0.45 : 0;
      /* divide by at least 4 so a two-word risk cannot score a perfect match */
      const score = sum / Math.max(4, rw.length);
      if (!best || score > best.score) best = { act:id, n, score };
    }
  }
  if (best && best.score > 0) return best;
  const f = inFlightStep(it.stageId);
  return f && { act:f.act, n:f.n, score:0 };
}
/* the step a stage is on now: the first unfinished step whose window has opened,
   else the first unfinished one, else the stage's last step */
function inFlightStep(key){
  const acts = actsByStage[key] || [];
  let open = null, any = null;
  for (const id of acts) for (const d of stepDates(id)) {
    any = { act:id, n:d.n };
    if (stepDone(id, d.n)) continue;
    if (TODAY >= d.start) return { act:id, n:d.n };
    if (!open) open = { act:id, n:d.n };
  }
  return open || any;
}
/* One list for the communication board: what the programme was seeded with, with
   any edits laid over it, plus what has been posted here since — and without what
   has been taken back out. Same shape as the key-info board below it. */
function freeItems(st){
  const seeded = (itemsByStage[st] || []).filter(i => i.kind === "activity");
  const mine = ST.bPosts.filter(i => i.stageId === st);
  return seeded.concat(mine)
    .filter(i => !ST.bGone[i.id])
    .map(i => ST.bEdits[i.id] ? Object.assign({}, i, ST.bEdits[i.id]) : i);
}
/* A post's comments, oldest first: a conversation is read in the order it happened. */
function commentsOf(id){
  const seeded = (updatesByItem[id] || []);
  const mine = ST.bComments.filter(c => c.itemId === id);
  return seeded.concat(mine)
    .filter(c => !ST.bCommentGone[c.id])
    .map(c => ST.bCommentEdits[c.id] ? Object.assign({}, c, { text: ST.bCommentEdits[c.id] }) : c)
    .sort((x, y) => new Date(x.createdAt) - new Date(y.createdAt));

/* What a post is about, in the words the board prints. */
function aboutOf(i){ return i.activityRef ? (i.stepN ? i.activityRef + " · step " + i.stepN : i.activityRef) : null; }
const posterOf = i => i.author || i.owner || "";
const keyItems  = st => (itemsByStage[st] || []).filter(i => i.kind === "keyinfo");
/* One list for the key-info board: what the programme was seeded with (with any edits
   laid over it) and what has been written here since. Newest first — a board people
   come back to reads best with the last thing learned at the top. */
function notesOf(key){
  const out = [];
  for (const i of keyItems(key)) {
    if (ST.noteGone[i.id]) continue;
    out.push(Object.assign({ id:i.id, stageId:key, title:i.title, body:i.body || "",
                             who:ME, at:i.updatedAt, seeded:true }, ST.noteEdits[i.id] || {}));
  }
  for (const n of ST.notes) if (n.stageId === key && !ST.noteGone[n.id]) out.push(Object.assign({}, n));

}
const noteById = id => {

};
const noteAtt = id => ST.noteAtt[id] || [];
/* Every risk on the programme is a post flagged on a step. Shaped like an item so the
   risk list, the overview count, the timeline and the mail drafts all keep reading

   answered, so it drops out — of the count, the list, and the row's flag alike. */
function stepRisks(st){
  const out = [];
  for (const p of ST.posts) {
    if (!p.risk || !ACTS[p.act] || ACTS[p.act].st !== st) continue;
    if (!riskLive(p)) continue;
    out.push({ id:"sr:"+p.id, postId:p.id, stageId:st, kind:"risk", title:p.text, body:"",
               owner:p.who, role:(ACTS[p.act].ro || [])[0] || "",

}
const openRisks = st => stepRisks(st);
const allOpenRisks = () => STAGES.reduce((t, s) => t.concat(openRisks(s.key)), []);
const isOverdue = i => !i.done && i.due && startOfDay(new Date(i.due)) < TODAY;
/* Overdue is a step whose due date has gone by with nothing handed over. Shaped like an

function allOverdue(){

/* Deliverable rows are seeded from /data/journey.ts; their reference tags live in
   /data/activityIndex.ts, generated from the authoring document. The two lists hold
   the same 167 items but have drifted apart in spelling — "Characterisation" vs
   "Characterization", "flavour" vs "flavor", "sign-off" vs "signoff" — and one has
   genuinely different wording. Fold the orthography, then fall back to word overlap
   inside the same stage, so every row still finds its tag. */
const normTitle = t => String(t||"").toLowerCase()
  .replace(/isation\b/g,"ization").replace(/ised\b/g,"ized").replace(/ising\b/g,"izing")
  .replace(/\bflavour/g,"flavor").replace(/\bbehaviour/g,"behavior").replace(/\bcolour/g,"color")
  .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

  const prefixStage = {};
  for (const [id, a] of Object.entries(ACTS)) prefixStage[id.split("-")[0]] = a.st;
  const byNorm = {}; for (const [ref, t] of Object.entries(DELIV)) byNorm[normTitle(t)] = ref;
  const out = {}, taken = new Set();

  for (const d of rows) { const r = byNorm[normTitle(d.title)]; if (r && !taken.has(r)) { out[d.id] = r; taken.add(r); } }
  const wordsOf = t => normTitle(t).split(" ").filter(w => w.length > 2);

    if (out[d.id]) continue;

    let best = null, score = 0;
    for (const [ref, t] of Object.entries(DELIV)) {
      if (taken.has(ref) || prefixStage[ref.split("-")[0]] !== d.stageId) continue;
      const rw = wordsOf(t), shared = dw.filter(w => rw.includes(w)).length;
      const sc = shared / Math.max(1, Math.min(dw.length, rw.length));

    if (best && score >= 0.5) { out[d.id] = best; taken.add(best); }

})();
const delivRef = d => d ? (DELIV_REF[d.id] || null) : null;
const delivPost  = id => ST.delivPost[id] || null;
const delivAttOf = id => (ST.delivPost[id] && ST.delivPost[id].att) || [];

/* which step produces which deliverable ref (TEST-D2 …) */
function delivStepOf(actId, ref){
  const a = ACTS[actId];

function delivsOfAct(id){
  const refs = refsOf(id);

/* And the ones a step hands over: whatever has been attached to it, plus — on the last

function delivsOfStep(id, n){
  const out = [], seen = new Set();
  for (const a of attOf(id, n)) {
    if (a.kind !== "deliv" || !a.delivId || seen.has(a.delivId)) continue;
    const d = SEED.deliverables.find(x => x.id === a.delivId);
    if (d) { seen.add(d.id); out.push(d); }

  if (+n === ACTS[id].s.length)
    for (const d of delivsOfAct(id)) if (!seen.has(d.id)) { seen.add(d.id); out.push(d); }
  return out;
}

/* ═══ search ══════════════════════════════════════ */
function buildIndex(){

  for (const s of STAGES)
    ix.push({ k:"Stage", ref:s.shortTitle, t:s.title, ctx:(PHASES.find(p=>p[0]===s.phaseId)||[])[1]||"", go:["stage",s.key] });
  for (const id of ACT_IDS) {
    const a = ACTS[id], st = stageBy[a.st];
    ix.push({ k:"Activity", ref:id, t:a.t, ctx:st?st.title:"", go:["activity",id] });
    for (const [n, text] of a.s)
      ix.push({ k:"Step", ref:id+"·"+n, t:text, ctx:a.t, go:["stage",a.st,"activity"] });
  }
  for (const d of SEED.deliverables)
    ix.push({ k:"Deliverable", ref:(d.id||"").toUpperCase(), t:d.title, ctx:(stageBy[d.stageId]||{}).title||"", go:["stage",d.stageId,"deliverables"] });
  for (const i of SEED.items) {
    if (i.kind === "risk" || i.kind === "keyinfo") continue;   /* both are indexed below */
    ix.push({ k:"Tracked activity", ref:"", t:i.title,
              ctx:((stageBy[i.stageId]||{}).title||"")+(i.owner?" · "+i.owner:""),
              go:["stage",i.stageId,"activity"], item:i.id });
  }
  for (const st of STAGES) for (const nt of notesOf(st.key))
    ix.push({ k:"Key info", ref:"", t:nt.title, ctx:st.title+(nt.who?" · "+nt.who:""),
              go:["stage",st.key,"keyinfo"], note:nt.id });
  for (const p of ST.posts) {
    if (!p.risk || !ACTS[p.act]) continue;
    const st = stageBy[ACTS[p.act].st];
    ix.push({ k:"Risk", ref:p.act+(p.stepN?"·"+p.stepN:""), t:p.text,
              ctx:(st?st.title:"")+" · "+p.who, go:["stage",ACTS[p.act].st,"risks"] });
  }
  INDEX = ix; return ix;
}
function searchIndex(q){
  const needle = q.trim().toLowerCase();
  if (!needle) return [];
  const words = needle.split(/\s+/);
  const hits = [];
  for (const e of buildIndex()) {
    const hay = (e.ref+" "+e.t+" "+e.ctx).toLowerCase();
    if (!words.every(w => hay.includes(w))) continue;
    /* a reference match is what you meant; a title match beats a context match */
    const score = e.ref.toLowerCase().startsWith(needle) ? 0
                : e.t.toLowerCase().startsWith(needle) ? 1
                : e.t.toLowerCase().includes(needle) ? 2 : 3;
    hits.push({ e, score });
    if (hits.length > 400) break;
  }
  const rank = { Program:0, Stage:1, Activity:2, Risk:3, Deliverable:4, Step:5, "Key info":6, "Tracked activity":7 };
  return hits.sort((a,b) => a.score - b.score || rank[a.e.k] - rank[b.e.k]).slice(0, 40).map(h => h.e);
}
let PAL = { open:false, q:"", cur:0, res:[] };
function openPalette(seed){
  PAL = { open:true, q:seed||"", cur:0, res:searchIndex(seed||"") };

}
function closePalette(){ PAL.open = false; const n = document.getElementById("scrim"); if (n) n.remove(); }
function drawPalette(){
  let n = document.getElementById("scrim");
  if (!n) { n = document.createElement("div"); n.id = "scrim"; document.body.appendChild(n); }
  const groups = [];
  for (const e of PAL.res) { const g = groups.find(x => x[0] === e.k); if (g) g[1].push(e); else groups.push([e.k, [e]]); }
  let i = -1;
  const body = PAL.q.trim() === ""
    ? '<div class="empty" style="padding:34px 20px"><p class="mono-note">Search 23 stages, 257 activities, 1,649 steps, 167 deliverables and everything recorded on this program.</p></div>'
    : (PAL.res.length
      ? groups.map(([k, list]) => '<div class="gh">'+esc(k)+' <span style="color:var(--ink-4)">'+list.length+'</span></div>'+
          list.map(e => { i++; return '<button class="pres'+(i===PAL.cur?" cur":"")+'" data-hit="'+i+'">'+
            (e.ref?'<span class="ref">'+esc(e.ref)+'</span>':'<span></span>')+

            '<span class="ctx ell">'+esc(e.ctx)+'</span></button>'; }).join("")).join("")
      : '<div class="empty" style="padding:34px 20px"><p class="mono-note">Nothing matches “'+esc(PAL.q)+'”.</p></div>');
  n.innerHTML = '<div id="pal" role="dialog" aria-label="Search">'+
    '<div class="top"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b8f98" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'+

  '</div>';
}
function runHit(i){
  const e = PAL.res[i]; if (!e) return;
  closePalette();
  if (e.note) goWith({ note:e.note }, e.go[0], e.go[1], e.go[2]);
  else if (e.item) goWith({ item:e.item, act:null }, e.go[0], e.go[1], e.go[2]);
  else go.apply(null, e.go);
}
addEventListener("keydown", ev => {
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && ev.key.toLowerCase() === "k") { ev.preventDefault(); PAL.open ? closePalette() : openPalette(""); return; }
  if (!PAL.open) return;
  if (ev.key === "Escape") { ev.preventDefault(); closePalette(); }
  else if (ev.key === "ArrowDown") { ev.preventDefault(); PAL.cur = Math.min(PAL.res.length-1, PAL.cur+1); drawPalette(); document.querySelector(".pres.cur")?.scrollIntoView({block:"nearest"}); document.getElementById("q").focus(); }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); PAL.cur = Math.max(0, PAL.cur-1); drawPalette(); document.querySelector(".pres.cur")?.scrollIntoView({block:"nearest"}); document.getElementById("q").focus(); }
  else if (ev.key === "Enter") { ev.preventDefault(); runHit(PAL.cur); }
});
document.addEventListener("input", ev => {
  if (ev.target.id !== "q") return;
  PAL.q = ev.target.value; PAL.cur = 0; PAL.res = searchIndex(PAL.q);
  const pos = ev.target.selectionStart; drawPalette();
  const el = document.getElementById("q"); el.focus(); el.setSelectionRange(pos, pos);
});
document.addEventListener("click", ev => {
  if (ev.target.id === "scrim") return closePalette();
  const h = ev.target.closest("[data-hit]"); if (h) runHit(+h.getAttribute("data-hit"));
});

let ROUTE = { v:"programs" }, SEL = null;
function go(v, arg, arg2){ location.hash = "#" + v + (arg ? "/" + arg : "") + (arg2 ? "/" + arg2 : ""); }
function readHash(){
  const p = location.hash.replace(/^#/,"").split("/").filter(Boolean);
  return p.length ? { v:p[0], a:p[1], b:p[2] } : { v:"programs" };
}
let PENDING = null;
addEventListener("hashchange", () => { ROUTE = readHash(); SEL = PENDING; PENDING = null; clearPostUI(); clearDelivUI(); RISKOPEN = null; render(); });
/* navigate AND arrive with something selected — the hash change would otherwise
   clear SEL out from under us, and it never fires when the route is unchanged */
function goWith(sel, v, a, b){
  PENDING = sel;
  const before = location.hash;
  go(v, a, b);
  if (location.hash === before) { SEL = PENDING; PENDING = null; render(); }
}

/* The rail is 400px wide and scrolls, so it clips anything that reaches past its edge —
   a popover hung off a clip near the right of it would lose its last centimetre. Measured
   after it is drawn, because where the clip lands depends on the text beside it. */
function clampPopovers(){
  for (const pop of document.querySelectorAll(".menu-pop")) {
    pop.style.transform = "";
    const box = pop.closest(".peek-body") || pop.closest("#view");
    if (!box) continue;
    const p = pop.getBoundingClientRect(), b = box.getBoundingClientRect();
    const over = Math.round(p.right - (b.right - 8));
    if (over > 0) pop.style.transform = "translateX(-"+over+"px)";
  }
}
/* Only a box that is really cut off gets the fade that says so. Measured after the
   view is in the document, because nothing else knows how the text wrapped. */
function markOverflow(){
  for (const el of document.querySelectorAll(".noteprose"))
    el.parentNode.classList.toggle("scrolls", el.scrollHeight - el.clientHeight > 2);
}
/* and it stops saying so once you have read to the bottom. Captured, because scroll
   events on an inner box do not bubble. */
document.addEventListener("scroll", e => {
  const el = e.target;
  if (!el.classList || !el.classList.contains("noteprose")) return;
  el.parentNode.classList.toggle("at-end", el.scrollTop + el.clientHeight >= el.scrollHeight - 2);
}, true);

/* What a TPM has to touch today, ranked. Every row is derived — nothing here is
   hand-picked — and every row carries the action that clears it. */
/* ── what needs answering today ───────────────────
   The three tags used to be entity types wearing urgency costumes: "Late" only ever
   meant a step, "Blocks tapeout" only ever a risk, "Due soon" only ever a deliverable.
   Nothing you could reason about, and a deliverable ten days past due appeared nowhere
   at all because the due-soon window only looked forwards.

   One ladder now, asked of every kind of thing in the same order:

     Overdue     past its due date
     Due soon    due inside three weeks
     Stale risk  an open risk nobody has touched in over a week

   Blocking the mask order is not a fourth rung — it is true or false of any of them, so
   it rides as a flag that lifts the ranking rather than as a competing label. Scores are
   in one unit, days, so they can be compared: overdue outranks due-soon outranks stale,
   and the tapeout flag is worth more than any of the gaps inside a band. */
/* The bands are 1000 apart and the widest spread inside one is a few hundred, so a band
   is never jumped: overdue always outranks due-soon, which always outranks stale. The
   mask-order bonus is worth 300 — enough to order things inside a band, not enough to
   promote one out of it. An earlier 500 against gaps of 400 let a deliverable due in
   three days sit above things already a week past due, which read as a bug. */
const ATTN_BAND = { overdue:3000, soon:2000, stale:1000 }, ATTN_MTO = 300;
function attention(){
  const by = new Map();
  const push = o => { const prev = by.get(o.key);
    if (!prev || o.score > prev.score) by.set(o.key, o); };
  const mto = stage => { const st = stageBy[stage], t = tapeout(); return !!(st && t && st.end <= t && st.end >= TODAY); };

  /* every step past its due date */
  for (const i of allOverdue()) {
    const late = daysSince(i.due), blocks = mto(i.stageId);
    push({ key:"s:"+i.act+":"+i.stepN, tag:"Overdue", tone:"risk", type:"Step", blocks, ref:i.act,
           step:{act:i.act, n:i.stepN}, stage:i.stageId, owner:i.owner, title:i.title,
           why: late+" day"+(late===1?"":"s")+" past due", score: ATTN_BAND.overdue + late + (blocks ? ATTN_MTO : 0) });
  }
  /* every key deliverable, whether it is late or merely close */
  for (const d of SEED.deliverables) {
    if (delivDone(d) || !d.due) continue;
    const n = Math.round((startOfDay(new Date(d.due)) - TODAY) / DAY), blocks = mto(d.stageId);
    if (n > 21) continue;
    push(n < 0
      ? { key:"d:"+d.id, tag:"Overdue", tone:"risk", type:"Deliverable", blocks, deliv:d,
          ref:delivRef(d), step:delivStep(d), stage:d.stageId, owner:"", title:d.title,
          why: (-n)+" day"+(n===-1?"":"s")+" past due", score: ATTN_BAND.overdue + (-n) + (blocks ? ATTN_MTO : 0) }
      : { key:"d:"+d.id, tag:"Due soon", tone:"warn", type:"Deliverable", blocks, deliv:d,
          ref:delivRef(d), step:delivStep(d), stage:d.stageId, owner:"", title:d.title,
          why: n === 0 ? "due today" : "due in "+n+" day"+(n===1?"":"s"), score: ATTN_BAND.soon - n + (blocks ? ATTN_MTO : 0) });
  }
  /* an open risk with no date of its own is judged on how long it has gone unanswered */
  for (const i of allOpenRisks()) {
    const quiet = i.updatedAt ? daysSince(i.updatedAt) : 0;
    if (quiet <= 7) continue;
    const blocks = mto(i.stageId);
    /* a risk is flagged on a step and answered on that step, so it is a step here too */
    push({ key:"r:"+i.id, tag:"Stale risk", tone:"warn", type:"Step", blocks, ref:i.act,
           step: i.act ? {act:i.act, n:i.stepN} : null, stage:i.stageId, owner:i.owner, title:i.title,
           why: "no update in "+quiet+" days", score: ATTN_BAND.stale + quiet + (blocks ? ATTN_MTO : 0) });
  }
  /* Ranked, and all of it. There used to be a per-tag cap here — four overdue, three due
     soon, two stale — so that every band got a showing. It meant that with seventeen
     things overdue, thirteen of them were missing from the list of what needs answering
     today, which is the one thing this card exists to say. The list scrolls instead. */
  return [...by.values()].sort((a, b) => b.score - a.score);
}
/* The whole row is the link. Three buttons at the end of it were three ways of asking

function attnRow(o){

/* ═══ a post, and putting one right ═══════════════
   A post is something someone typed, so they get to fix a typo or take it back.
   Only posts this app wrote carry an id; seeded updates have none and stay as they
   are. One card is drawn for the activity thread, the step thread and the feed, so
   the controls behave the same wherever an update is read. */
let EDITP = null,    /* the post open in the editor */
    DELP = null,     /* the post being asked about before it goes */
    EDITTXT = null,  /* what is typed but not yet saved, so a re-render cannot eat it */
    TEAMED = null,   /* the person open in the team editor, or "new:"+stage */
    REPLYTO = null,  /* the post whose reply box is open */
    REPLYTXT = null; /* and what has been typed into it */
let RISKOPEN = null; /* the risk whose thread is open in the Risks tab — kept across the
                        re-renders that editing and replying cause, dropped on navigation */
let NOTEED = null,   /* the note open in the editor, or "new:"+stage */
    NOTEDRAFT = null,/* its title and body as typed, so a re-render cannot eat them */
    NOTELINK = null; /* the note whose link box is open */
function clearPostUI(){ EDITP = DELP = EDITTXT = TEAMED = REPLYTO = REPLYTXT = NOTEED = NOTEDRAFT = NOTELINK = null; }
const postById = id => ST.posts.find(p => p.id === id) || null;
/* Closing a risk takes more than one line: someone raises it, someone answers, someone
   confirms it is gone. Replies hang under the post they answer, one level deep, so that
   sequence reads as one exchange rather than as three unrelated updates. */
const repliesOf = p => (p && p.replies) || [];
/* a post, or one of its replies, by id — the editor and the delete confirm take both */
function findPost(id){
  for (const p of ST.posts) {
    if (p.id === id) return { p, parent:null };
    for (const r of repliesOf(p)) if (r.id === id) return { p:r, parent:p };
  }
  return null;
}
function addReply(postId){
  const hit = findPost(postId);
  if (!hit || hit.parent) return;                      /* replies do not nest further */
  const box = $("#rp");
  const txt = (REPLYTXT != null ? REPLYTXT : (box ? box.value : "")).trim();
  if (!txt) return;
  (hit.p.replies = hit.p.replies || []).push({ id:newId("r"), reply:true, text:txt, who:ME, at:new Date().toISOString() });
  REPLYTO = REPLYTXT = null; save(); render();
}

function openEdit(id){
  EDITP = id; DELP = null; EDITTXT = null; render();
  const t = $("#ed"); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
}
function savePost(id){
  const hit = findPost(id); if (!hit) { clearPostUI(); return render(); }
  const p = hit.p;
  const txt = (EDITTXT != null ? EDITTXT : p.text).trim();
  /* an empty post is a deletion, and deletion is asked for on its own */
  if (!txt) return;
  p.text = txt;
  if (!p.reply) p.risk = $("#edrisk") ? $("#edrisk").checked : p.risk;
  p.editedAt = new Date().toISOString();
  save(); clearPostUI(); render();
}
function deletePost(id){
  const hit = findPost(id);
  /* a post takes its thread with it; a reply takes only itself */
  if (hit && hit.parent) hit.parent.replies = repliesOf(hit.parent).filter(r => r.id !== id);
  else ST.posts = ST.posts.filter(p => p.id !== id);
  clearPostUI(); save(); render();
}

function postActions(p, canReply){
  if (!p.id || EDITP === p.id || DELP === p.id) return "";
  return '<span style="flex-grow:1"></span><span class="acts">'+
    (canReply && !p.reply ? '<button data-replyto="'+p.id+'">Reply</button>' : "")+
    '<button data-editpost="'+p.id+'">Edit</button>'+
    '<button class="del" data-delpost="'+p.id+'">Delete</button></span>';
}
function postEditor(p){
  return '<div class="composer" style="margin-top:6px"><textarea id="ed">'+esc(EDITTXT != null ? EDITTXT : p.text)+'</textarea>'+
    '<div class="bar">'+
      (p.reply ? "" : '<label style="display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2)"><input type="checkbox" id="edrisk"'+(p.risk?" checked":"")+'> risk</label>')+
      '<span style="font-size:11px;color:var(--ink-4)">⌘↵ saves · esc cancels</span>'+
      '<span style="flex-grow:1"></span>'+
      '<button class="btn sm" data-canceledit>Cancel</button>'+
      '<button class="btn pri sm" data-savepost="'+p.id+'">Save</button></div></div>';
}
function postDelConfirm(p){
  return '<div class="delconf"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#c5303a" stroke-width="2"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>'+

    '<button class="btn sm" data-canceldel>Keep</button>'+
    '<button class="btn sm dng" data-confirmdel="'+p.id+'">Delete</button></div>';
}
const RISKLINE = '<div style="display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:11.5px;color:var(--risk-ink)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#e5484d" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>Flagged as a risk on this step</div>';
function replyThread(p){
  const rs = repliesOf(p);
  if (!rs.length && REPLYTO !== p.id) return "";
  return '<div class="replies">'+
    rs.map(r => {
      const editing = EDITP === r.id, deleting = DELP === r.id;
      return '<div class="reply">'+av(r.who, true)+'<div style="flex-grow:1;min-width:0">'+
        '<div class="who"><b style="font-size:12.5px">'+esc(r.who)+'</b>'+
          '<span class="num" style="font-size:11px;color:var(--ink-3)">'+fmtDT(r.at)+'</span>'+
          (r.editedAt ? '<span class="edited">edited</span>' : "")+
          postActions(r)+'</div>'+
        (editing ? postEditor(r) : deleting ? postDelConfirm(r)
          : '<div class="txt">'+esc(r.text)+'</div>')+
      '</div></div>';
    }).join("")+
    (REPLYTO === p.id
      ? '<div class="reply">'+av(ME, true)+
          '<div class="composer" style="flex-grow:1"><textarea id="rp" placeholder="Reply — what moved, and what closed it…">'+esc(REPLYTXT || "")+'</textarea>'+
          '<div class="bar"><span style="font-size:11px;color:var(--ink-4)">⌘↵ posts · esc cancels</span>'+
            '<span style="flex-grow:1"></span>'+
            '<button class="btn sm" data-replycancel>Cancel</button>'+
            '<button class="btn pri sm" data-replysave="'+p.id+'">Reply</button></div></div>'+
        '</div>'
      : '<button class="addreply" data-replyto="'+p.id+'">+ Reply</button>')+
  '</div>';
}
/* showStep: the activity thread names which step a post is about; the step thread is
   already about one step, so it shows the risk flag there instead. */
function postCard(p, showStep){
  const editing = p.id && EDITP === p.id, deleting = p.id && DELP === p.id;
  return '<div class="post">'+av(p.who)+'<div style="flex-grow:1;min-width:0">'+
    '<div class="who"><b style="font-size:13px">'+esc(p.who)+'</b>'+
      (showStep && p.stepN ? '<span class="pill '+(riskLive(p)?"risk":"acc")+'" style="font-size:10.5px">STEP '+p.stepN+'</span>' : "")+
      (p.risk ? (riskLive(p)
        ? (showStep ? "" : '<span class="pill risk" style="font-size:10.5px">RISK</span>')
        : '<span class="pill" style="font-size:10.5px" title="the step it was flagged on has been handed over">RISK · CLEARED</span>') : "")+
      '<span class="num" style="font-size:11.5px;color:var(--ink-3)">'+fmtDT(p.at)+'</span>'+
      (p.editedAt ? '<span class="edited">edited</span>' : "")+
      postActions(p, true)+
    '</div>'+
    (editing ? postEditor(p)
     : deleting ? postDelConfirm(p)
     : '<div class="txt">'+esc(p.text)+'</div>'+(showStep && riskLive(p) ? RISKLINE : "")+replyThread(p))+
  '</div></div>';
}

function postRow(p){
  const s = stageBy[p.stage];
  const editing = p.id && EDITP === p.id, deleting = p.id && DELP === p.id;

/* ── the timeline's x-axis ───────────────────────────────
   Always the whole programme: expanding a stage or an activity adds rows, it never
   rescales the chart under you. */
function tlWindow(){ return [SPAN_START, SPAN_END, null]; }
let TW = [SPAN_START, SPAN_END, null];
const tp = d => ((d - TW[0]) / (TW[1] - TW[0])) * 100;
/* a bar that runs past the window is clipped to the edge, not dropped */
function clampBar(a, b){
  const l = Math.max(0, a), r = Math.min(100, b);
  if (r <= 0.2) return { l:0, w:0.5, off:1 };
  if (l >= 99.8) return { l:99.5, w:0.5, off:1 };
  return { l, w: Math.max(0.3, r - l), off:0 };
}
function barStyle(from, to, col, extra){
  const c = clampBar(tp(from), tp(to));
  return 'left:'+c.l.toFixed(2)+'%;width:'+c.w.toFixed(2)+'%;background:'+col+';opacity:'+(c.off?.3:1)+';display:block'+(extra||"");
}

/* three row heights, and the bar grows with the row so the chart does not turn into
   hairlines floating in space at the tall setting */
/* [row height, bar height, diamond box, date size]. The diamond is sized against the
   room a rotated square gives along its centre line — box * 1.414, less the border —
   measured against the date rather than guessed, so MM/DD never touches the edge. */
const TLROWS = { compact:[21,7,23,7.5], normal:[26,10,27,8], tall:[38,17,34,9.5] };
const tlRow = () => TLROWS[ST.tlRow] ? ST.tlRow : "normal";

/* Checkpoints bunch up — three inside a fortnight is normal — so the labels are placed
   after the browser has drawn them: measure each one and drop it a lane if it would land
   on the one before it. Nothing about a label's width is knowable before that. */
/* A bar that ends near the right edge would write its checkpoint off the chart, so that
   one writes leftwards instead, back over its own bar. Measured after the browser has
   drawn it, because a label's width is not knowable before that. */
function layoutMilestones(){
  for (const el of document.querySelectorAll(".tl-tail")) {
    el.classList.remove("flip");
    if (el.offsetLeft + el.offsetWidth > el.parentNode.clientWidth) el.classList.add("flip");
  }
}

/* One row per engineering activity of the stage, on the same axis as the bars above. */
function stageBreakdown(s){
  const ids = actsByStage[s.key] || [];
  if (!ids.length) return '<div class="tl-head"><span class="nm"><span style="font-size:11.5px;color:var(--ink-3)">No activities written for this stage.</span></span><span></span></div>';
  const steps = ids.reduce((t,id)=>t+ACTS[id].s.length,0), done = ids.reduce((t,id)=>t+doneCount(id),0);
  return '<div class="tl-head">'+
      '<span class="nm">'+
        '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#5b5bd6" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>'+
        '<b style="font-size:11.5px;color:var(--accent-hov)">'+ids.length+' activities</b>'+
        '<span class="num" style="font-size:11px;color:var(--ink-3)">'+done+'/'+steps+' steps · '+stageMM(s.key).toLocaleString()+' M/M</span></span>'+
      '<span style="position:relative;height:28px;margin-right:20px;display:flex;align-items:center;justify-content:flex-end">'+
        '<span class="num" style="font-size:11px;color:var(--ink-3)">'+fmt(s.start)+' → '+fmt(s.end)+' · '+s.durationWeeks+'w</span>'+
        '<button class="btn sm" style="height:22px;font-size:11.5px;margin-left:10px" data-stage="'+s.key+'">Open stage</button></span>'+
    '</div>'+
    ids.map(id => {
      const a = ACTS[id], [ws,we] = actWindow(id), st = actState(id);
      const c = clampBar(tp(ws), tp(we));
      const col = st.k === "done" ? "var(--st-done)" : st.risky ? "var(--st-risk)" : st.k === "run" ? "var(--st-run)" : "var(--st-future)";
      return '<button class="tl-sub" data-goact="'+id+'" title="Open '+esc(id)+' in '+esc(s.title)+'">'+
        '<span class="nm">'+
          (a.cp?'<span style="width:4px;height:4px;border-radius:50%;background:var(--risk);flex-shrink:0" title="Critical path"></span>':'<span style="width:4px;flex-shrink:0"></span>')+
          '<span class="ref" style="font-size:10.5px;padding:1px 6px;flex-shrink:0">'+esc(id)+'</span>'+
          '<span class="ell" style="font-size:12.5px;color:'+(st.k==="future"?"var(--ink-3)":"var(--ink-2)")+'">'+esc(a.t)+'</span>'+
          '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#b4b7bd" stroke-width="2.2" style="flex-shrink:0;margin-left:auto;margin-right:10px"><path d="m9 18 6-6-6-6"/></svg></span>'+
        '<span class="lane"><i class="b" style="'+barStyle(ws, we, col)+'"></i>'+
          (c.off?"":'<span class="num" style="position:absolute;left:calc('+(c.l+c.w).toFixed(2)+'% + 7px);top:6px;font-size:10px;color:'+(st.risky?"var(--risk)":"var(--ink-4)")+';white-space:nowrap">'+st.d+'/'+st.n+'</span>')+
        '</span></button>';
    }).join("");
}

function legend(c,l){ return '<span style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)"><span style="width:12px;height:6px;border-radius:3px;background:'+c+'"></span>'+esc(l)+'</span>'; }
/* the scale follows the window: years across a programme, months inside a stage */
function tlScale(){
  const months = (TW[1] - TW[0]) / DAY / 30.44;
  const out = [];
  if (months > 30) {
    for (let y = TW[0].getFullYear(); y <= TW[1].getFullYear(); y++) {
      const a = Math.max(0, tp(new Date(y,0,1))), b = Math.min(100, tp(new Date(y+1,0,1)));
      if (b <= 0 || a >= 100) continue;
      out.push([b-a, String(y)]);
    }
  } else {
    const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    let c = new Date(TW[0].getFullYear(), TW[0].getMonth(), 1);
    while (c <= TW[1]) {
      const nx = new Date(c.getFullYear(), c.getMonth()+1, 1);
      const a = Math.max(0, tp(c)), b = Math.min(100, tp(nx));
      if (b > 0 && a < 100) out.push([b-a, MON[c.getMonth()] + (c.getMonth()===0?" '"+String(c.getFullYear()).slice(2):"")]);
      c = nx;
    }
  }
  /* years are the frame the whole chart is read against, so they carry weight rather
     than sitting in the same grey as everything else */
  const big = months > 30;
  return out.map(([g,l]) => '<div style="flex-grow:'+Math.max(1,g)+';flex-basis:0;font-size:'+(big?"14px":"11.5px")+
    ';font-weight:'+(big?700:500)+';letter-spacing:'+(big?"-.01em":"0")+';color:var(--'+(big?"ink-2":"ink-3")+
    ');padding:'+(big?"6px 0 6px 9px":"5px 0 5px 6px")+';border-right:1px solid var(--line);overflow:hidden;white-space:nowrap">'+esc(l)+'</div>').join("");
}
