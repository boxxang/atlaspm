/* A stage read in one line each: how much of the work is done, how much of the window
   is spent, and whether those two agree. The gap between them is the number a TPM is
   actually after — 60% of the calendar spent against 30% of the steps done is the
   sentence, not either figure on its own. */
function stageDash(key, s, acts, steps, done, dl){
  const stepsPct = steps ? Math.round(done / steps * 100) : 0;
  const dn = dl.filter(delivDone).length, delivPct = dl.length ? Math.round(dn / dl.length * 100) : 0;
  const span = s.end - s.start;
  const elapsed = Math.max(0, Math.min(100, span ? (TODAY - s.start) / span * 100 : 0));
  const rk = openRisks(key).length;
  const late = acts.reduce((t, id) => t + ACTS[id].s.filter(sp => stepLate(id, sp[0])).length, 0);
  const running = acts.filter(id => actState(id).k === "run").length;
  const wk = Math.max(1, Math.round((TODAY - s.start) / DAY / 7));
  const gap = Math.round(stepsPct - elapsed);

  let verdict;
  if (TODAY < s.start) verdict = { t:"Not started · begins "+fmt(s.start), col:"var(--ink-3)" };
  else if (TODAY > s.end) verdict = stepsPct >= 100
    ? { t:"Complete · closed "+fmt(s.end), col:"var(--ok)" }
    : { t:"Past its window with "+(steps - done)+" step"+(steps-done===1?"":"s")+" still open", col:"var(--risk)" };
  else if (gap <= -8) verdict = { t:"Work is "+(-gap)+" points behind the calendar", col:"var(--risk)" };
  else if (gap >= 8)  verdict = { t:"Work is "+gap+" points ahead of the calendar", col:"var(--ok)" };
  else verdict = { t:"On pace · within "+Math.abs(gap)+" points of the calendar", col:"var(--ink-2)" };

  const bar = (pct, col) => '<span class="bar dbar" style="display:block"><i style="width:'+pct+'%;background:'+(col||"var(--accent)")+'"></i></span>';
  const dstat = (k, v, sub, extra, tone, goTab) =>
    '<'+(goTab ? 'button class="dstat go" data-tab="'+key+"/"+goTab+'"' : 'div class="dstat"')+'>'+
      '<div class="subcap"'+(tone?' style="color:var(--risk-ink)"':"")+'>'+esc(k)+'</div>'+
      '<div class="num" style="font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:3px'+(tone?";color:var(--risk)":"")+'">'+esc(v)+'</div>'+
      '<div style="font-size:11.5px;color:var(--ink-3);margin-top:1px">'+esc(sub)+'</div>'+
      (extra||"")+
    '</'+(goTab ? "button" : "div")+'>';

  return '<div class="card sdash">'+
    dstat("Steps", stepsPct+"%", done+" of "+steps+" done", bar(stepsPct), 0, "activity")+
    dstat("Key deliverables", dn+"/"+dl.length, delivPct+"% released", bar(delivPct, "var(--ok)"), 0, "deliverables")+
    dstat("Open risks", rk, rk ? "on steps still running" : "none flagged", "", rk ? 1 : 0, "risks")+
    dstat("Past due", late, "step"+(late===1?"":"s")+" overdue", "", late ? 1 : 0, "activity")+
    dstat("Activities", running+" / "+acts.length, "running now", "")+
    dstat("Effort", stageMM(key).toLocaleString(), "M/M · $"+(stageMM(key)*RATE/1e6).toFixed(1)+"M", "")+
    '<div class="sdash-pace">'+
      '<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">'+
        '<b style="font-size:12.5px;color:'+verdict.col+'">'+esc(verdict.t)+'</b>'+
        '<span style="flex-grow:1"></span>'+
        '<span class="num" style="font-size:11.5px;color:var(--ink-3)">'+fmt(s.start)+" → "+fmt(s.end)+'</span></div>'+
      '<span class="pacebar"><i style="width:'+stepsPct+'%"></i><b style="left:calc('+elapsed.toFixed(1)+'% - 1px)"></b></span>'+
      '<div class="pacekey">'+
        '<span><i style="background:var(--accent)"></i>'+stepsPct+'% of steps done</span>'+
        '<span><i style="background:var(--ink);width:2px"></i>'+Math.round(elapsed)+'% of the window spent'+
          (TODAY >= s.start && TODAY <= s.end ? " · week "+wk+" of "+s.durationWeeks : "")+'</span>'+
      '</div>'+
    '</div>'+
  '</div>';
}
function stageStateLabel(s){
  if (TODAY > s.end) return "Complete";
  if (TODAY < s.start) return "Starts "+fmt(s.start);
  const w = Math.max(1, Math.round((TODAY-s.start)/DAY/7)), t = s.durationWeeks;
  return "In flight · week "+w+" of "+t;

function stageActivity(key){
  /* Start-ordered, because a stage reads as a plan. Template order is a logical
     grouping — the main flow, then the long-running work that watches it — and it
     put the assembly stage's first activity, the interposer and substrate build,
     at the bottom. Sorted here rather than in the index: reference IDs come from
     position, so reordering the index would renumber the stage. */
  const acts = (actsByStage[key] || []).slice().sort((x,y) => {
    const [xs,xe] = actWindow(x), [ys,ye] = actWindow(y);
    return xs - ys || xe - ye || x.localeCompare(y);
  });
  const COLS = [["chk",16,""],["ref",72,"REF"],["title",null,"ACTIVITY"],["steps",128,"STEPS"],

  for (const id of acts) {

      '<span style="display:flex;align-items:center;gap:8px">'+segFor(id)+stateChip(st)+'</span>'+
      '<span style="justify-self:start;min-width:0">'+(refs[0]?'<span class="pill" style="font-size:10.5px">'+esc(refs[0])+'</span>':"")+'</span>'+

    if (open) out += stepBlock(id);

  return out + '</div>';

/* People retype a template activity in their own words — "Market & customer

   matching finds none of those, so score on shared significant words instead. */
const STOP = new Set(["and","the","for","with","from","into","per","of","a","an","to","on","in","at","by"]);

function attachOutput(id, n, rec){
  const k = stepKey(id, n);
  (ST.att[k] = ST.att[k] || []).push(Object.assign(
    { id:newId("a"), at:new Date().toISOString(), who:ME }, rec));
  /* the upload dates the step — and only the first one does, so attaching a second
     file later does not quietly move the completion date */
  if (!stepDone(id, n)) ST.steps[k] = { done:true, at:new Date().toISOString() };
  /* Only a deliverable actually attached here gets ticked. An activity that produces
     two of them is not finished with both because one arrived. */
  if (rec.kind === "deliv" && rec.delivId) ST.deliv[rec.delivId] = true;

  if (gone && gone.kind === "deliv" && gone.delivId) ST.deliv[gone.delivId] = false;
  ST.att[k] = attOf(id, n).filter(x => x.id !== aid);
  /* nothing handed over any more, so the step is not complete any more */
  if (!ST.att[k].length) { delete ST.att[k]; ST.steps[k] = { done:false, at:new Date().toISOString() }; }
  save();
}

/* ── cross-stage work views ── */
/* True when the item sits on a stage that has to close before the mask order goes out.
   It is a property of the STAGE, not of the item: every risk and every late step on a
   pre-tapeout stage answers the same. So it is stated once, on the stage's own bar,
   against the stage's end date — repeating it on each row made it read as if this
   particular risk were the thing blocking tapeout, which is not what it says. */
function blocksMTO(i){
  const st = stageBy[i.stageId], t = tapeout();
  return !!(st && t && st.end <= t && st.end >= TODAY);
}
/* ── the two cross-programme lists ───────────────────
   Every open risk, and every step past its due date. One table with different columns,
   built the way every other table in the app is built — .ctable with a named, resizable
   header row. These two were the only lists in the programme without one, which is most
   of why they read as noise: five columns of dates and pills and nothing saying which
   was which.

   Ordering answers "what do I look at first": whatever blocks the mask order, then
   whatever has been sitting longest. Stages are ordered by their worst item, so the top
   group is the one in most trouble, and the toolbar says so instead of claiming a sort
   it never did. */
let XF = { risks:"all", overdue:"all" };
const daysSince = d => Math.max(0, Math.round((TODAY - startOfDay(new Date(d))) / DAY));
const XFILT = {
  risks:   [["all","All"], ["mto","On stages before tapeout"], ["stale","No update in 7 days"]],
  overdue: [["all","All"], ["mto","On stages before tapeout"], ["stale","Over two weeks late"]]
};
function xPred(kind, k){
  if (k === "mto")   return i => blocksMTO(i);
  if (k === "stale") return kind === "risks" ? i => i.updatedAt && daysSince(i.updatedAt) > 7
                                             : i => daysSince(i.due) > 14;
  return () => true;
}
/* Both lists are read by the same two numbers: the date the step was due, and how far
   past it we are. A risk carries no date of its own — the one that matters is on the step
   it was flagged against. */
function xDue(i){
  const b = stepOf(i);
  if (b) return stepDueDate(b.act, b.n);
  return i.due ? new Date(i.due) : null;
}
function xLate(i){
  const b = stepOf(i), d = xDue(i);
  if (!d || (b && stepDone(b.act, b.n))) return 0;
  return Math.max(0, Math.round((TODAY - startOfDay(d)) / DAY));
}

function crossView(kind){
  const title = kind === "risks" ? "Risks" : "Overdue";
  const all = kind === "risks" ? allOpenRisks() : allOverdue();
  const rows = all.filter(xPred(kind, XF[kind])).sort((x, y) =>
    xLate(y) - xLate(x) || (xDue(x) || Infinity) - (xDue(y) || Infinity));

  head(title, '<span class="pill">'+all.length+(kind === "risks" ? " open" : " late")+'</span>',
    '<span style="font-size:12px;color:var(--ink-3)">Furthest past due first, then soonest due</span>');

  const chips = '<div class="chips">'+XFILT[kind].map(([k, l]) => {
      const n = all.filter(xPred(kind, k)).length;
      return '<button class="chip'+(XF[kind] === k ? " on" : "")+'" data-xf="'+kind+":"+k+'">'+esc(l)+
        ' <span style="opacity:.65">'+n+'</span></button>';
    }).join("")+'</div>';

  /* No stage grouping: the activity tag on every row already names the stage, and the
     grouping cut the list into six blocks each with its own ordering, which hid the one
     thing worth reading across the whole programme — what is furthest past due. */
  const COLS = [["ref",84,"ACTIVITY"],["n",54,"STEP"],
                ["title",null,kind === "risks" ? "RISK" : "WHAT IS LATE"],
                ["status",104,"STATUS"],["due",86,"DUE"],["late",88,"LATE BY"],
                ["by",168,kind === "risks" ? "RAISED BY" : "OWNER"]];

  const body = '<div class="ctable xtable" style="--ct:'+ctVar("x"+kind, COLS)+'">'+cthead("x"+kind, COLS)+
    rows.map(i => {
      const b = stepOf(i), late = xLate(i), due = xDue(i);
      const dt = b ? (stepDates(b.act).find(d => d.n === b.n) || {}) : {};
      const stt = b ? stepStatus(b.act, b.n, dt, true) : null;
      /* whoever the step is assigned to. The role the template names is not a person and
         does not belong in a column headed OWNER. */
      const who = kind === "risks" ? i.owner : (b ? stepOwner(b.act, b.n) : "");
      /* A risk is a sentence, not a label — cutting it off at the column edge throws away
         the thing you came to read. And how it was answered is the other half of it, so
         the thread comes with it, set in under the same rail the panels use. */
      const wrap = kind === "risks";
      const rs = wrap && i.postId ? repliesOf(postById(i.postId)) : [];
      return '<button class="trow" '+(b ? 'data-gostep="'+b.act+":"+b.n+'"' : 'data-item="'+i.id+'"')+
          (wrap ? ' style="align-items:start;padding-top:11px;padding-bottom:12px"' : "")+'>'+
        '<span style="justify-self:center'+(wrap?";margin-top:1px":"")+'">'+(b ? '<span class="ref">'+esc(b.act)+'</span>'
                                                : '<span class="pill" style="font-size:10.5px">'+esc(i.kind)+'</span>')+'</span>'+
        '<span class="num" style="text-align:center;font-size:12px;color:var(--ink-2)'+(wrap?";margin-top:2px":"")+'">'+(b ? b.n : "—")+'</span>'+
        '<span style="min-width:0">'+
          '<span'+(wrap ? ' style="display:block;font-weight:500;line-height:1.5"' : ' class="ell" style="font-weight:500"')+'>'+esc(i.title)+'</span>'+
          (rs.length ? '<span class="replies xreplies">'+rs.map(r =>
              '<span class="reply">'+av(r.who, true)+'<span style="min-width:0">'+
                '<span class="who"><b style="font-size:12px">'+esc(r.who)+'</b>'+
                  '<span class="num" style="font-size:10.5px;color:var(--ink-3)">'+fmtDT(r.at)+'</span></span>'+
                '<span class="txt">'+esc(r.text)+'</span></span></span>').join("")+'</span>' : "")+
        '</span>'+
        '<span style="justify-self:center'+(wrap?";margin-top:1px":"")+'">'+(stt ? statusPill(stt) : "—")+'</span>'+
        '<span class="num" style="text-align:center;font-size:12px;font-weight:'+(late ? 600 : 400)+
          ';color:'+(late ? "var(--risk)" : "var(--ink-2)")+(wrap?";margin-top:2px":"")+'">'+(due ? fmtShort(due) : "—")+'</span>'+
        '<span class="num" style="text-align:center;font-size:12.5px;font-weight:'+(late > 14 ? 600 : 400)+
          ';color:'+(late ? "var(--risk)" : "var(--ink-4)")+(wrap?";margin-top:1px":"")+'">'+(late ? late+' day'+(late === 1 ? "" : "s") : "—")+'</span>'+
        '<span style="display:flex;align-items:center;gap:6px;min-width:0'+(wrap?";margin-top:1px":"")+'">'+
          (who ? av(who, true)+'<span class="ell" style="font-size:12px;color:var(--ink-2)">'+esc(who)+'</span>'
               : '<span style="font-size:12px;color:var(--ink-4)">Unassigned</span>')+'</span>'+
      '</button>';
    }).join("")+'</div>';

  const empty = '<div class="empty"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#d8dade" stroke-width="1.5"><path d="M20 6 9 17l-5-5"/></svg>'+
    '<p class="mono-note" style="max-width:48ch">'+
    (XF[kind] === "all"
      ? (kind === "risks" ? "No open risks on the programme. Flagging <b>risk</b> on a step's progress puts it here."
                          : "No step is past its due date.")
      : "Nothing matches this filter. "+all.length+" "+(kind === "risks" ? "open risk" : "late step")+(all.length === 1 ? "" : "s")+" in total.")+
    '</p></div>';

  $("#view").innerHTML = chips + (rows.length ? body : empty);
  if (SEL && SEL.item) renderPeek(); else $("#peek").hidden = true;
}

function prevAct(id){ const k=Object.keys(ACTS), i=k.indexOf(id); return k[(i-1+k.length)%k.length]; }
function nextAct(id){ const k=Object.keys(ACTS), i=k.indexOf(id); return k[(i+1)%k.length]; }
function refGroup(label, ids){
  if (!ids || !ids.length) return "";
  return '<div style="margin-bottom:12px"><div style="font-size:11.5px;color:var(--ink-3);margin-bottom:6px">'+esc(label)+'</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:5px">'+ids.map(x=>'<button class="ref" data-open="'+esc(x)+'">'+esc(x)+'</button>').join("")+'</div></div>';
}
/* the main sequence on one line, the parallel steps under it — as the write-up draws it */
function laneDiagram(id){
  const a = ACTS[id], total = a.w[1]-a.w[0];
  let cur = 0, lastMain = 0, main = [], par = [];
  for (const [n,, tat, isPar] of a.s) {
    const from = isPar ? lastMain : cur;
    if (!isPar) { lastMain = cur; cur = from + tat; }
    (isPar ? par : main).push({ n, l: from/total*100, w: tat/total*100 });
  }
  const ticks = [];
  for (let w = 0; w <= total; w += Math.max(1, Math.round(total/5))) ticks.push(w);
  const bars = (list, filled) => list.map(b =>
    '<span class="lane-b" style="left:'+b.l.toFixed(1)+'%;width:'+Math.max(3,b.w).toFixed(1)+'%;'+
    (filled ? 'background:var(--accent);color:#fff' : 'border:1.5px solid var(--accent);background:var(--accent-wash);color:var(--accent)')+'">'+b.n+'</span>').join("");
  return '<div class="lane-d">'+
    '<div class="num" style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-4);margin-bottom:7px">'+ticks.map(w=>'<span>w'+w+'</span>').join("")+'</div>'+
    '<div style="font-size:11px;color:var(--ink-3);font-weight:600;margin-bottom:5px">MAIN SEQUENCE</div>'+
    '<div style="position:relative;height:18px;margin-bottom:9px">'+bars(main, true)+'</div>'+
    (par.length ? '<div style="font-size:11px;color:var(--ink-3);font-weight:600;margin-bottom:5px">IN PARALLEL</div>'+
      '<div style="position:relative;height:18px">'+bars(par, false)+'</div>' : "")+
    (a.fn ? '<p style="font-size:12px;line-height:1.5;color:var(--ink-3);margin-top:10px">'+rich(a.fn)+'</p>' : "")+
  '</div>';
}
function factCell(k, v, s, last){
  return '<div style="padding:11px 14px;'+(last?"":"border-right:1px solid var(--line-soft)")+'">'+
    '<div class="subcap">'+esc(k)+'</div><div class="num" style="font-size:17px;font-weight:600;margin-top:4px">'+esc(v)+"</div>"+
    '<div style="font-size:11.5px;color:var(--ink-4);margin-top:2px">'+esc(s)+"</div></div>";
}

function head(title, extra, right){
  $("#hd").innerHTML = "<h1>"+esc(title)+"</h1>"+(extra||"")+'<span style="flex-grow:1"></span>'+(right||"");
}

  if (t.hasAttribute("data-close-peek")) { clearPostUI(); SEL = SEL && SEL.exp ? {exp:SEL.exp} : null; return render(); }

  /* the step panel's link to its activity selects it without folding the steps away */

  if (t.hasAttribute("data-item"))  { OUTM = null; clearPostUI(); SEL = Object.assign({}, SEL, {item:t.getAttribute("data-item"), act:null, step:null}); return render(); }
  if (t.hasAttribute("data-tab"))   { const [k,tab] = t.getAttribute("data-tab").split("/"); return go("stage", k, tab); }

  if (t.hasAttribute("data-tl"))    { const k = t.getAttribute("data-tl"); SEL = (SEL&&SEL.tl===k) ? null : {tl:k}; return render(); }
  if (t.hasAttribute("data-stage")) return go("stage", t.getAttribute("data-stage"));
  if (t.hasAttribute("data-go"))    return go(t.getAttribute("data-go"));
});

/* the percent handle: the number follows the drag, the store follows the release */
document.addEventListener("input", e => {
  if (!e.target.matches || !e.target.matches("#stpct")) return;
  const v = +e.target.value, lab = $("#stpctv");
  if (lab) { lab.textContent = v + "%"; lab.style.color = v ? "var(--ink)" : "var(--ink-4)"; }
  e.target.style.background = rngFill(v, v >= 100);
});
document.addEventListener("change", e => {
  if (!e.target.matches) return;
  /* The post window is re-rendered from ST, so what has been typed has to live
     there: every field writes the draft, and choosing an activity redraws so the
     step picker can offer that activity's steps rather than staying shut. */
  if (e.target.matches("[data-bf]") && ST.bWin) {
    const k = e.target.getAttribute("data-bf");
    ST.bWin.draft = Object.assign({}, ST.bWin.draft, { [k]: e.target.value });
    if (k === "activityRef") { ST.bWin.draft.stepN = ""; return render(); }
    return;
  }
  if (e.target.matches("#stpct") && SEL && SEL.step) {
    const [id, n] = SEL.step.split(":");
    return setStepPct(id, +n, +e.target.value), render();
  }
  if (e.target.matches("#stown")) {
    const [id, n] = e.target.getAttribute("data-stepown").split(":"), v = e.target.value;
    if (v) ST.stepOwner[stepKey(id, +n)] = v; else delete ST.stepOwner[stepKey(id, +n)];
    return save(), render();
  }
  if (e.target.matches("[data-stepdue]")) {
    const [id, n] = e.target.getAttribute("data-stepdue").split(":"), v = e.target.value;
    if (v) ST.stepDue[stepKey(id, +n)] = v; else delete ST.stepDue[stepKey(id, +n)];
    return save(), render();
  }
  if (e.target.matches("[data-stepcomp]")) {
    const [id, n] = e.target.getAttribute("data-stepcomp").split(":"), v = e.target.value, k = stepKey(id, +n);
    /* a completion date is what "done" means, so setting one ticks the step and
       clearing one opens it again — noon local, because a bare date has no time */
    if (v) { const d = dayFromIso(v); d.setHours(12); ST.steps[k] = { done:true, at:d.toISOString() }; }
    else ST.steps[k] = { done:false, at:new Date().toISOString() };
    return save(), render();
  }
});
document.addEventListener("input", e => {
  if (e.target.matches && e.target.matches("[data-bf]") && ST.bWin) {
    ST.bWin.draft = Object.assign({}, ST.bWin.draft, { [e.target.getAttribute("data-bf")]: e.target.value });
    return;
  }
  if (e.target.matches && e.target.matches("[data-bcnew]")) { ST.bCommentDraft = e.target.value; return; }

  if (!e.target.matches) return;
  if (e.target.matches("#ed")) EDITTXT = e.target.value;
  else if (e.target.matches("#rp")) REPLYTXT = e.target.value;
  else if (e.target.matches("#ntitle")) NOTEDRAFT = Object.assign({}, NOTEDRAFT, { title:e.target.value });
  else if (e.target.matches("#nbody"))  NOTEDRAFT = Object.assign({}, NOTEDRAFT, { body:e.target.value });
  else if (e.target.matches("#dpbody")) DPDRAFT = e.target.value;
  else if (e.target.matches("#nq")) {
    /* filtered in place rather than re-rendered, so the caret stays where it is typed */
    const q = e.target.value.trim().toLowerCase();
    for (const el of document.querySelectorAll("[data-notematch]"))
      el.hidden = !!q && el.getAttribute("data-notematch").indexOf(q) < 0;
  }
});
document.addEventListener("keydown", e => {
  if (!e.target.matches) return;
  if (e.target.matches("#lnk") && e.key === "Enter") { e.preventDefault(); return addLink(); }
  if (e.target.matches("#tnm,#trole,#tmail,#tphone") && TEAMED) {
    if (e.key === "Enter") { e.preventDefault(); return saveTeam(TEAMED); }
    if (e.key === "Escape") { e.preventDefault(); TEAMED = null; return render(); }
  }
  if (e.target.matches("#ed")) {
    if (e.key === "Escape") { e.preventDefault(); EDITP = EDITTXT = null; render(); }
    else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); savePost(EDITP); }
  }
  if (e.target.matches("#rp")) {
    if (e.key === "Escape") { e.preventDefault(); REPLYTO = REPLYTXT = null; render(); }
    else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addReply(REPLYTO); }
  }
  if (e.target.matches("#nlnk") && e.key === "Enter") { e.preventDefault(); return addNoteLink(NOTELINK); }
  if (e.target.matches("#dlnk") && e.key === "Enter") { e.preventDefault(); return addDelivLink(DLINK); }
  if (e.target.matches("#ntitle,#nbody") && NOTEED) {
    if (e.key === "Escape") { e.preventDefault(); NOTEED = NOTEDRAFT = null; render(); }
    else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveNote(NOTEED); }
  }
});

migrateRisks();
ROUTE = readHash();
render();
</script>
