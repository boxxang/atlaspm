<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Details — AtlasPM</title>
<style>
:root{
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink-2:#52514e;--ink-3:#898781;
  --line:#e1e0d9;--line-strong:#c3c2b7;--accent:#256abf;--accent-soft:#e7effa;
  --risk:#d03b3b;--risk-soft:#fbeceb;--fs-base:17px;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:var(--fs-base);line-height:1.5;color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
code{font-family:var(--mono);font-size:.86em}

.shell{display:grid;grid-template-columns:296px minmax(0,1fr);height:100vh}

/* ---------- nav ---------- */
.nav{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.nav-head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.nav-head h1{font-size:.86em;font-weight:650;letter-spacing:-.01em;margin-bottom:3px}
.nav-head .sub{font-family:var(--mono);font-size:.62em;color:var(--ink-3);letter-spacing:.05em}
.nav-head input{
  width:100%;margin-top:10px;border:1px solid var(--line);border-radius:4px;background:var(--page);
  padding:5px 9px;font-size:.78em;font-family:var(--sans);
}
.nav-head input:focus-visible{outline:none;border-color:var(--accent)}
.nav-tools{display:flex;gap:6px;margin-top:8px}
.nav-tools button{
  font-family:var(--mono);font-size:.58em;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line-strong);border-radius:3px;padding:4px 8px;color:var(--ink-2);
}
.nav-tools button[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.nav-list{overflow-y:auto;padding:8px 0 30px;min-height:0;flex:1}
.nav-stage{
  font-family:var(--mono);font-size:.58em;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);padding:12px 18px 5px;display:flex;justify-content:space-between;gap:8px;
}
.nav-stage .cnt{font-weight:400;letter-spacing:.04em}
.nav-stage.full .cnt{color:var(--accent)}
.nav-a{
  display:grid;grid-template-columns:3.9rem minmax(0,1fr);gap:8px;align-items:baseline;
  width:100%;text-align:left;padding:5px 18px;font-size:.76em;color:var(--ink-3);line-height:1.35;
  border-left:2px solid transparent;
}
.nav-a .id{font-family:var(--mono);font-size:.86em}
.nav-a.has{color:var(--ink-2)}
.nav-a.has:hover{background:var(--accent-soft)}
.nav-a[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent);color:var(--ink)}
.nav-a:not(.has){opacity:.55;cursor:default}
.nav-a:not(.has) .id::after{content:" ·";color:var(--line-strong)}

/* ---------- detail pane ---------- */
.pane{overflow-y:auto;min-height:0}
.pane-inner{max-width:1100px;margin:0 auto;padding:0 34px 60px}
.empty{padding:80px 34px;color:var(--ink-3);font-size:.9em;max-width:56ch;line-height:1.6}

.ad-head{
  position:sticky;top:0;z-index:3;background:var(--page);
  display:flex;align-items:baseline;gap:13px;flex-wrap:wrap;
  padding:20px 0 13px;border-bottom:1px solid var(--line-strong);margin-bottom:22px;
}
.ad-id{font-family:var(--mono);font-size:.72em;font-weight:600;letter-spacing:.08em;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:3px}
.ad-head h2{font-size:1.1em;font-weight:650;letter-spacing:-.01em}
.ad-head .spacer{flex:1}
.ad-crumb{font-family:var(--mono);font-size:.68em;color:var(--ink-3);letter-spacing:.04em}
.ad-nav{display:flex;gap:5px}
.ad-nav button{font-family:var(--mono);font-size:.66em;border:1px solid var(--line);border-radius:3px;padding:2px 8px;color:var(--ink-3)}
.ad-nav button:hover{color:var(--accent);border-color:var(--accent)}

.ad-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));border:1px solid var(--line);border-radius:5px;background:var(--surface);margin-bottom:26px;overflow:hidden}
.ad-fact{padding:11px 14px;border-right:1px solid var(--line)}
.ad-fact:last-child{border-right:0}
.ad-fact .k{display:block;font-family:var(--mono);font-size:.56em;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.ad-fact .v{font-family:var(--mono);font-size:.96em;font-variant-numeric:tabular-nums}
.ad-fact .v small{font-size:.64em;color:var(--ink-3)}
.ad-fact .d{font-family:var(--mono);font-size:.6em;color:var(--ink-3);display:block;margin-top:2px}

.ad-grid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:32px;align-items:start}
section.ad-sec{margin-bottom:28px}
.cap{font-family:var(--mono);font-size:.6em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line-strong);margin-bottom:12px}
.cap .n{color:var(--ink-3);font-weight:400;letter-spacing:.04em}
.ad-lede{font-family:var(--serif);font-size:.95em;line-height:1.62;color:var(--ink-2);max-width:64ch}
.ad-lede+.ad-lede{margin-top:10px}
.ad-lede b{color:var(--ink);font-weight:600}
.ad-note{font-size:.82em;line-height:1.5;color:var(--ink-2);margin-top:12px}

.ad-flow{border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:14px 16px 12px}
.ad-axis{position:relative;height:15px;margin-bottom:8px;border-bottom:1px solid var(--line-strong)}
.ad-axis span{position:absolute;top:0;font-family:var(--mono);font-size:.56em;color:var(--ink-3);transform:translateX(-50%);white-space:nowrap}
.ad-lane{position:relative;height:26px;margin-bottom:5px}
.ad-lane::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.ad-step{position:absolute;top:2px;height:22px;border-radius:3px;background:var(--accent);color:#fff;display:flex;align-items:center;gap:6px;padding:0 7px;overflow:hidden;font-family:var(--mono);font-size:.58em;letter-spacing:.03em;white-space:nowrap}
.ad-step.par{background:var(--ink-3)}
.ad-step b{font-weight:700}
.ad-lane-tag{font-family:var(--mono);font-size:.55em;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 2px}
.ad-steps-head,.ad-steps li{display:grid;grid-template-columns:1.6rem minmax(0,1fr) 4rem 3.8rem;gap:12px}
.ad-steps-head{font-family:var(--mono);font-size:.54em;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding-bottom:5px;border-bottom:1px solid var(--line-strong);margin-top:16px}
.ad-steps-head span:nth-child(3),.ad-steps-head span:nth-child(4){text-align:right}
.ad-steps{list-style:none}
.ad-steps li{align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:.85em}
.ad-steps li:last-child{border-bottom:0}
.ad-steps .n{font-family:var(--mono);font-size:.76em;color:var(--ink-3)}
.ad-steps .w{font-family:var(--mono);font-size:.74em;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ad-steps .lane{font-family:var(--mono);font-size:.62em;letter-spacing:.06em;text-transform:uppercase;text-align:right;color:var(--ink-3)}
.ad-steps .lane.par{color:var(--accent)}

.ad-io{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.ad-io h4{font-family:var(--mono);font-size:.58em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
ul.ad-list{list-style:none;display:flex;flex-direction:column;gap:5px}
ul.ad-list li{display:flex;gap:9px;font-size:.85em;line-height:1.45;color:var(--ink-2)}
ul.ad-list li::before{content:"—";color:var(--line-strong);font-family:var(--mono);flex:none}

.ad-rel{list-style:none}
.ad-rel li{display:grid;grid-template-columns:4.4rem 5.4rem minmax(0,1fr);gap:11px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.ad-rel li:last-child{border-bottom:0}
.ad-rel .did{font-family:var(--mono);font-size:.7em;color:var(--accent);font-weight:600}
.rel{font-family:var(--mono);font-size:.55em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:2px 0;text-align:center}
.rel.produces{color:var(--accent);background:var(--accent-soft)}
.rel.feeds,.rel.informs{color:var(--ink-2)}
.rel.gates{color:var(--risk);background:var(--risk-soft)}
.ad-rel .txt{font-size:.85em;line-height:1.45;color:var(--ink-2)}
.ad-rel .txt b{color:var(--ink);font-weight:600}

ul.ad-risks{list-style:none}
ul.ad-risks li{display:flex;gap:10px;font-size:.85em;line-height:1.45;color:var(--ink-2);padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
ul.ad-risks li:last-child{border-bottom:0}
ul.ad-risks li::before{content:"▲";color:var(--risk);font-size:.7em;flex:none}
ul.ad-risks b{color:var(--ink);font-weight:600}

.ad-side{border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:16px 18px 18px}
.ad-side section{margin-bottom:22px}
.ad-side section:last-child{margin-bottom:0}
.ad-kv,.ad-split,.ad-roles{display:flex;flex-direction:column}
.ad-kv div{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:.82em}
.ad-kv div:last-child{border-bottom:0}
.ad-kv .k{color:var(--ink-3)}
.ad-kv .v{font-family:var(--mono);font-size:.92em;font-variant-numeric:tabular-nums;text-align:right}
.ad-split div{display:grid;grid-template-columns:minmax(0,1fr) 2.6rem;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:.8em;color:var(--ink-2)}
.ad-split div:last-child{border-bottom:0;color:var(--ink);font-weight:600}
.ad-split .mm{font-family:var(--mono);font-size:.92em;text-align:right;font-variant-numeric:tabular-nums}
.ad-roles div{padding:7px 0;border-bottom:1px solid var(--line);font-size:.79em;color:var(--ink-3);line-height:1.4}
.ad-roles div:last-child{border-bottom:0}
.ad-roles b{display:block;color:var(--ink);font-weight:600;font-size:1.04em;margin-bottom:1px}
.ad-crit li{font-size:.82em}
.ad-crit li::before{content:"·";color:var(--ink-3);font-family:var(--mono)}
.ad-chain{display:flex;flex-wrap:wrap;gap:5px}
.ad-chain button{font-family:var(--mono);font-size:.66em;letter-spacing:.04em;color:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:3px 7px;background:var(--page)}
.ad-chain button:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.ad-chain button.dead{opacity:.45;cursor:default}
.ad-none{font-size:.78em;color:var(--ink-3);line-height:1.45}

@media (max-width:1080px){.ad-grid{grid-template-columns:minmax(0,1fr)}.ad-io{grid-template-columns:1fr}}
@media (max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}.nav{display:none}}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav">
    <div class="nav-head">
      <h1>Activity details</h1>
      <div class="sub" id="tally"></div>
      <input id="q" type="search" placeholder="Search id or text…" aria-label="Search activities">
      <div class="nav-tools">
        <button id="f-all" aria-pressed="true">All</button>
        <button id="f-has" aria-pressed="false">Written only</button>
      </div>
    </div>
    <div class="nav-list" id="list"></div>
  </nav>
  <main class="pane" id="pane"></main>
</div>

TECH-06","text":"Foundry legal engagement — NDA, design agreement, IP licensing frame","tat":8,"mm":2,"cont":false},{"id":"TECH-07","text":"Foundry roadmap and risk-production timing alignment","tat":4,"mm":1.5,"cont":false},{"id":"TECH-08","text":"Second-source and node-migration strategy assessment","tat":4,"mm":1.5,"cont":false},{"id":"TECH-09","text":"OSAT and backend supply chain preliminary alignment","tat":5,"mm":2,"cont":false}],"deliverables":[{"id":"TECH-D1","title":"Technology selection report and decision record"},{"id":"TECH-D2","title":"Process option / flavour sheet agreed with foundry"},{"id":"TECH-D3","title":"Wafer, mask and NRE cost sheet"},{"id":"TECH-D4","title":"Executed foundry design agreement (DA) and NDA"},{"id":"TECH-D5","title":"Capacity and tapeout slot commitment"},{"id":"TECH-D6","title":"Node risk assessment — maturity, defect density, yield learning curve"}]},{"code":"PDK","name":"PDK & Design Enablement","n":4,"band":"enable","start":8,"dur":36,"activities":[{"id":"PDK-01","text":"PDK version roadmap tracking (0.1 → 0.5 → 1.0 → production) and delta impact analysis","tat":34,"mm":14,"cont":true},{"id":"PDK-02","text":"Design rule manual review; restricted and recommended rule disposition","tat":6,"mm":5,"cont":false},{"id":"PDK-03","text":"Standard cell library selection and qualification (track height, multi-Vt, multi-bit flops)","tat":8,"mm":9,"cont":false},{"id":"PDK-04","text":"Memory compiler evaluation and instance generation (SRAM, register file)","tat":9,"mm":10,"cont":false},{"id":"PDK-05","text":"Compiler instance PPA characterisation against block budgets — density, Vmin, access time, leakage","tat":6,"mm":7,"cont":false},{"id":"PDK-06","text":"Custom / pushed-rule memory instance decision, scope and schedule impact assessment","tat":4,"mm":3,"cont":false},{"id":"PDK-07","text":"IO, ESD and latch-up library qualification","tat":6,"mm":5,"cont":false},{"id":"PDK-08","text":"EDA tool version qualification for the node — syn ":"PTV-10","text":"Board-level reliability on vehicles — temperature cycle, drop, bend","tat":14,"mm":8,"cont":false},{"id":"PTV-11","text":"Daisy-chain continuity test and assembly yield learning","tat":9,"mm":6,"cont":false},{"id":"PTV-12","text":"Feedback into package design and assembly process window freeze","tat":7,"mm":5,"cont":false}],"deliverables":[{"id":"PTV-D1","title":"Test vehicle plan and risk coverage matrix"},{"id":"PTV-D2","title":"MTV, TTV and daisy-chain vehicle designs"},{"id":"PTV-D3","title":"Built vehicle lots with assembly travelers"},{"id":"PTV-D4","title":"Warpage and co-planarity data across the reflow profile"},{"id":"PTV-D5","title":"CPI stress assessment report — ULK, bump and BEOL integrity"},{"id":"PTV-D6","title":"Thermal characterisation report with model correlation (Rjc, TIM, hotspot map)"},{"id":"PTV-D7","title":"Board-level reliability data on vehicles"},{"id":"PTV-D8","title":"Frozen assembly process window definition"},{"id":"PTV-D9","title":"Package validation complete record — gate for product wafer-out"}]},{"code":"SIPI","name":"Chip-Package-System Co-Verification","n":18,"band":"integrate","start":50,"dur":26,"activities":[{"id":"SIPI-01","text":"Chip power model (CPM/CPS) extraction per power domain and operating mode","tat":7,"mm":8,"cont":false},{"id":"SIPI-02","text":"Package and board model extraction — 3D EM, S-parameter and RLC network","tat":8,"mm":10,"cont":false},{"id":"SIPI-03","text":"Die-package-board PDN co-simulation — DC and AC impedance versus target","tat":9,"mm":12,"cont":false},{"id":"SIPI-04","text":"Dynamic voltage-drop analysis with package inductance and real switching profiles","tat":8,"mm":10,"cont":false},{"id":"SIPI-05","text":"Decoupling capacitor budget and placement optimisation across die, package and board","tat":7,"mm":7,"cont":false},{"id":"SIPI-06","text":"SSN / SSO and simultaneous-switching noise analysis at the IO ring","tat":5,"mm":5,"cont":false},{"id":"SIPI-07","text":"High-speed channel simulation with extracted package models — insertion loss, crosstalk, return path","tat":9,"mm":11,"cont":false},{"id":"SIPI-08","text":"Eye diagram, jitter and BER budget closure per interface (PCIe/CXL, HBM, die-to-die)","tat":8,"mm":9,"cont":false},{"id":"SIPI-09","text":"Power-aware timing correlation — voltage drop back-annotated into STA","tat":5,"mm":5,"cont":false},{"id":"SIPI-10","text":"Electro-thermal co-analysis coupled with the package thermal model","tat":5,"mm":5,"cont":false},{"id":"SIPI-11","text":"Co-verification signoff review and criteria disposition with design and package teams","tat":4,"mm":3,"cont":false}],"deliverables":[{"id":"SIPI-D1","title":"Chip power model (CPM/CPS) release per domain and mode"},{"id":"SIPI-D2","title":"Extracted package and board electrical models"},{"id":"SIPI-D3","title":"PDN impedance and dynamic IR co-simulation report"},{"id":"SIPI-D4","title":"Decap budget and placement specification across die, package and board"},{"id":"SIPI-D5","title":"Channel compliance report per interface, with margins"},{"id":"SIPI-D6","title":"Eye, jitter and BER budget closure record"},{"id":"SIPI-D7","title":"Power-aware STA correlation report"},{"id":"SIPI-D8","title":"Chip-package-system co-verification signoff — tapeout gate"}]},{"code":"ASSY","name":"Assembly & Package Build","n":19,"band":"integrate","start":98,"dur":8,"activities":[{"id":"ASSY-01","text":"Known-good-die sort and selection","tat":3,"mm":5,"cont":false},{"id":"ASSY-02","text":"HBM stack procurement and incoming inspection","tat":3,"mm":2,"cont":false},{"id":"ASSY-03","text":"Die attach, micro-bump and thermo-compression bonding","tat":3,"mm":6,"cont":false},{"id":"ASSY-04","text":"Interposer and substrate assembly, underfill, molding","tat":3,"mm":5,"cont":false},{"id":"ASSY-05","text":"Lid / TIM attach and ball attach","tat":2,"mm":3,"cont":false},{"id":"ASSY-06","text":"Assembly inline inspection — X-ray, CSAM, warpage metrology","tat":2,"mm":3,"cont":false},{"id":"ASSY-07","text":"Assembly yield analysis and process tuning","tat":5,"mm":6,"cont":false},{"id":"ASSY-08","text":"Package-level open / short and continuity test","tat":2,"mm":3,"cont":false},{"id":"ASSY-09","text":"Unit build for bring-up, qualification and customer samples","tat":3,"mm":3,"cont":false}],"deliverables":[{"id":"ASSY-D1","title":"Assembled units — bring-up, qualification and sample lots"},{"id":"ASSY-D2","title":"Assembly travelers and process data"},{"id":"ASSY-D3","title":"Assembly yield report and failure pareto"},{"id":"ASSY-D4","title":"Package-level inspection and test data"},{"id":"ASSY-D5","title":"Unit allocation record across bring-up, qual and customers"}]},{"code":"EVB","name":"Validation Hardware / EVB","n":20,"band":"validate","start":52,"dur":38,"activities":[{"id":"EVB-01","text":"Validation platform requirements and topology definition","tat":5,"mm":5,"cont":false},{"id":"EVB-02","text":"EVB schematic design — power tree, clocking, host interface, connectors","tat":10,"mm":14,"cont":false},{"id":"EVB-03","text":"PCB layout with high-speed channel SI/PI simulation","tat":12,"mm":18,"cont":false},{"id":"EVB-04","text":"PCB fabrication and assembly","tat":8,"mm":4,"cont":false},{"id":"EVB-05","text":"Power delivery, VRM and telemetry design and bring-up","tat":7,"mm":8,"cont":false},{"id":"EVB-06","text":"Debug infrastructure — JTAG and trace pods, interposers, instrumentation headers","tat":7,"mm":8,"cont":false},{"id":"EVB-07","text":"Board bring-up with socketed or dummy parts","tat":7,"mm":10,"cont":false},{"id":"EVB-08","text":"Thermal solution and cooling for the lab platform","tat":7,"mm":7,"cont":false},{"id":"EVB-09","text":"Lab instrumentation reservation and test rack build","tat":7,"mm":8,"cont":false},{"id":"EVB-10","text":"Minimum host-side enablement for power-on (BSP handoff boundary)","tat":7,"mm":10,"cont":false}],"deliverables":[{"id":"EVB-D1","title":"Validation platform specification"},{"id":"EVB-D2","title":"EVB schematics, BOM and layout database"},{"id":"EVB-D3","title":"Fabricated and assembled boards, rev A/B with quantity plan"},{"id":"EVB-D4","title":"Board bring-up report and known issues"},{"id":"EVB-D5","title":"Debug and trace access documentation"},{"id":"EVB-D6","title":"Lab setup and instrument reservation plan"}]},{"code":"TEST","name":"Test Development","n":21,"band":"validate","start":54,"dur":42,"activities":[{"id":"TEST-01","text":"Test plan and coverage strategy — wafer sort, final test, system-level test","tat":8,"mm":12,"cont":false},{"id":"TEST-02","text":"ATE platform selection and tester time booking","tat":6,"mm":4,"cont":false},{"id":"TEST-03","text":"Probe card design, fabrication and qualification","tat":20,"mm":16,"cont":false},{"id":"TEST-04","text":"Load board / DUT board design, fabrication and bring-up","tat":17,"mm":16,"cont":false},{"id":"TEST-05","text":"Wafer sort test program development","tat":16,"mm":30,"cont":false},{"id":"TEST-06","text":"Final / package test program development","tat":16,"mm":28,"cont":false},{"id":"TEST-07","text":"Characterisation test content — shmoo, Vmin/Fmax, PVT sweeps","tat":12,"mm":20,"cont":false},{"id":"TEST-08","text":"DFT pattern porting to ATE format and pattern debug","tat":10,"mm":16,"cont":false},{"id":"TEST-09","text":"Test time and cost optimisation — parallelism, site count","tat":9,"mm":12,"cont":false},{"id":"TEST-10","text":"Correlation between ATE, bench and system results","tat":8,"mm":10,"cont":false},{"id":"TEST-11","text":"Test data infrastructure — STDF collection and yield database","tat":8,"mm":10,"cont":false}],"deliverables":[{"id":"TEST-D1","title":"Test plan and test coverage matrix"},{"id":"TEST-D2","title":"Qualified probe card and load board"},{"id":"TEST-D3","title":"Wafer sort and final test programs, release-tagged"},{"id":"TEST-D4","title":"Characterisation test suite"},{"id":"TEST-D5","title":"ATE-ready pattern set with debug log"},{"id":"TEST-D6","title":"Test time and test cost model"},{"id":"TEST-D7","title":"Test data infrastructure and yield database"}]},{"code":"BU","name":"Silicon Bring-up","n":22,"band":"validate","start":102,"dur":18,"activities":[{"id":"BU-01","text":"Sample receipt, incoming inspection and board mounting","tat":1.5,"mm":2,"cont":false},{"id":"BU-02","text":"Power-on, power sequencing and basic health check","tat":3,"mm":8,"cont":false},{"id":"BU-03","text":"Reset, clocking and PLL lock validation","tat":3,"mm":8,"cont":false},{"id":"BU-04","text":"Boot, firmware load and functional smoke test","tat":4,"mm":12,"cont":false},{"id":"BU-05","text":"Interface bring-up — PCIe/CXL link training, HBM training, die-to-die","tat":8,"mm":26,"cont":false},{"id":"BU-06","text":"Memory subsystem and bandwidth validation","tat":6,"mm":16,"cont":false},{"id":"BU-07","text":"Shmoo across voltage, frequency and temperature","tat":7,"mm":16,"cont":false},{"id":"BU-08","text":"Performance validation against the architecture model","tat":6,"mm":16,"cont":false},{"id":"BU-09","text":"Silicon debug of anomalies and failure analysis requests","tat":10,"mm":28,"cont":false},{"id":"BU-10","text":"Errata capture, workaround definition and documentation","tat":7,"mm":10,"cont":false},{"id":"BU-11","text":"Respin versus metal-fix decision analysis — ECO scope, cost, schedule","tat":4,"mm":5,"cont":false},{"id":"BU-12","text":"Customer sample readiness and release package","tat":5,"mm":6,"cont":false}],"deliverables":[{"id":"BU-D1","title":"Bring-up report with per-milestone health status"},{"id":"BU-D2","title":"Characterisation data set — V/F/T shmoo and power measurements"},{"id":"BU-D3","title":"Interface compliance results with training margins"},{"id":"BU-D4","title":"Errata list with workarounds"},{"id":"BU-D5","title":"Failure analysis reports"},{"id":"BU-D6","title":"Respin versus metal-fix decision record"},{"id":"BU-D7","title":"Customer sample release package"}]},{"code":"MP","name":"Qualification & Production","n":23,"band":"validate","start":106,"dur":26,"activities":[{"id":"MP-01","text":"Qualification plan definition against JEDEC / AEC standards","tat":6,"mm":8,"cont":false},{"id":"MP-02","text":"Reliability stress — HTOL, HTS, temperature cycle, uHAST, THB","tat":18,"mm":30,"cont":false},{"id":"MP-03","text":"ESD (HBM, CDM) and latch-up qualification","tat":6,"mm":8,"cont":false},{"id":"MP-04","text":"Package qualification — MSL, drop, bend, board-level reliability","tat":12,"mm":18,"cont":false},{"id":"MP-05","text":"Yield learning, failure pareto and defect analysis","tat":20,"mm":40,"cont":true},{"id":"MP-06","text":"Production test program release and guard-band validation","tat":9,"mm":20,"cont":false},{"id":"MP-07","text":"Test time reduction and multi-site conversion","tat":9,"mm":16,"cont":false},{"id":"MP-08","text":"Process corner and split-lot validation","tat":9,"mm":14,"cont":false},{"id":"MP-09","text":"Production readiness review and change control (PCN) setup","tat":6,"mm":8,"cont":false},{"id":"MP-10","text":"Capacity, supply chain and ramp commitment — wafer starts, substrate, HBM","tat":12,"mm":12,"cont":false},{"id":"MP-11","text":"Compliance and certification — PCIe/CXL compliance, RoHS/REACH, safety","tat":12,"mm":18,"cont":false},{"id":"MP-12","text":"Documentation release — datasheet, user guide, errata, application notes","tat":10,"mm":16,"cont":false}],"deliverables":[{"id":"MP-D1","title":"Qualification plan and JEDEC-compliant qualification report"},{"id":"MP-D2","title":"Reliability and package qualification data packages"},{"id":"MP-D3","title":"Production test program release"},{"id":"MP-D4","title":"Yield model versus cost target report"},{"id":"MP-D5","title":"Production readiness review sign-off"},{"id":"MP-D6","title":"Ramp plan and supply commitment"},{"id":"MP-D7","title":"Compliance certificates"},{"id":"MP-D8","title":"Datasheet and product documentation set"},{"id":"MP-D9","title":"Mass Production release record"}]}],"bands":[{"id":"define","label":"Define","note":"What the product must be, and what it will cost"},{"id":"enable","label":"Technology & IP Enablement","note":"Everything that must exist before design can start — the layer the current template is missing"},{"id":"design","label":"Design & Verify","note":"Logic, confidence, and testability"},{"id":"implement","label":"Implement","note":"Gates to a manufacturable layout, across a sequence of netlist drops"},{"id":"manufacture","label":"Manufacture","note":"Two mask releases, then silicon"},{"id":"integrate","label":"Integrate","note":"Package design, co-verification, vehicle validation and build"},{"id":"validate","label":"Validate & Ramp","note":"Proving it, and making it a product"}],"details":{"DEF-01":{"stage":"productDefinition","window":[0,4],"criticalPath":true,"purpose":["Turn what customers and the market are asking for into <b>one ranked, signed requirement set</b> that the whole program is measured against.","Everything downstream is an answer to this list — the PPA targets, the cost model, the feasibility call, the architecture itself. Until it is baselined and signed, every one of those answers is provisional. A requirement that arrives in week 30 costs roughly a hundred times what it costs here, and the difference is paid in silicon."],"steps":[{"n":1,"text":"Stakeholder map and interview plan","tat":0.5,"lane":"main"},{"n":2,"text":"Anchor-customer interviews — two accounts, six sessions","tat":1.5,"lane":"main"},{"n":3,"text":"Market and analyst input, segment sizing","tat":1,"lane":"par"},{"n":4,"text":"Requirement extraction, de-duplication, register build","tat":1,"lane":"main"},{"n":5,"text":"Conflict resolution and MoSCoW prioritisation workshop","tat":0.5,"lane":"main"},{"n":6,"text":"Traceability tagging to candidate KPIs and PPA targets","tat":0.5,"lane":"par"},{"n":7,"text":"Stakeholder review and baseline sign-off","tat":0.5,"lane":"main"}],"flowNote":"Seven steps add up to 5.5 weeks of work inside a 4-week window — steps 3 and 6 run alongside the main sequence. That is why the activity TAT and the sum of its steps do not match, and why pulling either parallel step onto the critical path costs a further 1.5 weeks.","consumes":["Customer RFI / RFQ responses","Field feedback and errata from the previous generation","Analyst forecasts and segment sizing","Competitor datasheets and public benchmarks","Sales pipeline and committed-volume view"],"produces":["Interview notes, per account","Requirement register — ID, owner, priority, acceptance measure","Conflict and deferral log","MoSCoW prioritisation record","Baseline sign-off sheet"],"rel":[{"id":"DEF-D1","rel":"produces","text":"<b>Product requirements document (PRD).</b> The register is the PRD's body — this activity is where the deliverable's content comes from, not merely a contributor to it."},{"id":"DEF-D2","rel":"feeds","text":"<b>Target specification — PPA and KPI table.</b> Each ranked requirement becomes a KPI line that <code>DEF-03</code> turns into a number. An untraced target is a target nobody asked for."},{"id":"DEF-D3","rel":"informs","text":"<b>Product cost and margin model.</b> Supplies the volume, segment and ASP assumptions the model is built on."},{"id":"DEF-D4","rel":"feeds","text":"<b>Feasibility report.</b> <code>DEF-07</code> tests <em>this</em> list against the candidate nodes — a feasibility study run against a different list proves nothing."},{"id":"DEF-D6","rel":"gates","text":"<b>Kickoff Go / No-Go decision record.</b> The gate reads the sign-off sheet. An unsigned register is a No-Go condition, not a footnote."}],"risks":["<b>Requirements not signed off by all stakeholders.</b> Sales agreeing verbally is not a signature, and the Go / No-Go gate reads signatures.","<b>Late customer additions after baseline.</b> With no change-control channel agreed at sign-off, the register keeps moving and nothing downstream can freeze.","<b>Requirements written as solutions.</b> \"Use HBM3E\" is an answer; \"819 GB/s sustained\" is a requirement. Solutions here remove the architect's options in <code>ARCH-02</code>.","<b>No acceptance measure.</b> A requirement that cannot be tested resurfaces at qualification, when the only remaining fix is a respin or a waiver.","<b>One anchor account dominating the list.</b> Requirements that fit a single customer and no segment turn a product into a bespoke part carrying a product's cost structure."],"roles":[{"r":"Requirements lead","d":"Owns the register and the baseline"},{"r":"Customer engagement","d":"One per anchor account, through the interview window"},{"r":"Product cost analyst","d":"Volume, segment and ASP assumptions"},{"r":"Feasibility liaison","d":"Flags requirements the node cannot carry"},{"r":"Stage lead","d":"Approves the baseline"}],"effort":[["Interviews and market input",1.5],["Register build and traceability",1.5],["Workshops and review",0.5],["Documentation and sign-off",0.5]],"entry":["Program charter drafted and funded to study","Anchor customers identified, NDAs executed","Previous-generation field feedback available"],"exit":["Every requirement has an owner, a priority and an acceptance measure","Conflicts resolved, or deferred with a named decision owner","Register baselined and signed by product, engineering and sales"],"dependsOn":[],"dependsNote":"Nothing upstream — this is the program's first activity. Its preconditions are the entry criteria above.","feedsInto":["DEF-02","DEF-05","DEF-06","DEF-07","ARCH-01","IPR-01"],"measuredBy":["Requirements baselined against the expected count","Share carrying an acceptance measure","Change requests raised after baseline"]},"DEF-02":{"stage":"productDefinition","window":[1,6],"criticalPath":true,"purpose":["The requirement register says what customers want. This says <b>what the silicon has to do</b> — the workloads it will actually run, and the KPI numbers derived from them.","A KPI with no workload behind it is a marketing number. <code>ARCH-01</code> spends fourteen weeks simulating against whatever this activity hands over; if the traces are not representative of the deployed mix, the architecture is optimised for a workload nobody runs, and nothing in verification will catch it."],"steps":[{"n":1,"text":"Use-case shortlist drawn from the requirement register","tat":0.5,"lane":"main"},{"n":2,"text":"Workload trace capture — LLM inference, vision, recommendation","tat":1.5,"lane":"main"},{"n":3,"text":"Reference runs on the previous generation for a baseline","tat":1,"lane":"par"},{"n":4,"text":"KPI derivation — TOPS, TOPS/W, tokens/s, time-to-first-token, batch scaling","tat":1.5,"lane":"main"},{"n":5,"text":"Precision and quantisation policy — INT8, FP8, mixed","tat":1,"lane":"par"},{"n":6,"text":"Sensitivity study — which KPI moves with which architectural knob","tat":1,"lane":"main"},{"n":7,"text":"Workload suite packaging and handoff to architecture","tat":0.5,"lane":"main"}],"flowNote":"The main sequence fills the 5-week window exactly. Steps 3 and 5 ride alongside it — the reference runs need lab time rather than analyst time, and the precision policy can be settled while traces are still being captured.","consumes":["Requirement register from DEF-01","Customer-supplied models and traces, where the NDA allows","Previous-generation silicon and its lab platform","Public model zoo and framework benchmarks","Deployment mix estimates from the segment sizing"],"produces":["Workload suite — traces, models, and the harness to run them","KPI derivation worksheet, one row per requirement","Precision and quantisation policy note","Sensitivity table — KPI against architectural knob","Baseline measurements on the previous generation"],"rel":[{"id":"DEF-D2","rel":"produces","text":"<b>Target specification — PPA and KPI table.</b> The KPI half of the deliverable is derived here; <code>DEF-03</code> supplies the PPA half."},{"id":"DEF-D1","rel":"feeds","text":"<b>Product requirements document.</b> The use-case list and the deployment mix are written back into the PRD as the context the requirements sit in."},{"id":"DEF-D4","rel":"feeds","text":"<b>Feasibility report.</b> Feasibility is tested against these KPI numbers, not against the requirement prose."}],"risks":["<b>Traces that flatter the design.</b> A workload suite assembled from what runs well on the previous generation will not find the case that breaks the new one.","<b>Customer models unavailable under NDA.</b> Substituting a public proxy is legitimate; not recording that a proxy was used is not.","<b>Deployment mix guessed rather than sized.</b> The architecture is tuned to the mix; a wrong mix misallocates silicon area that cannot be recovered later.","<b>Precision policy left open.</b> INT8 versus FP8 changes the datapath, the memory footprint and the KPI at once, and the decision gets more expensive every week it waits.","<b>KPIs quoted without conditions.</b> TOPS with no batch size, no sequence length and no precision is not a number anyone can design against."],"roles":[{"r":"Workload architect","d":"Owns the suite and the KPI derivation"},{"r":"ML performance engineer","d":"Trace capture, reference runs, precision study"},{"r":"Systems analyst","d":"Deployment mix and sensitivity analysis"},{"r":"Customer engagement","d":"Obtains models and confirms representativeness"},{"r":"Architecture liaison","d":"Takes the handoff and confirms it is modellable"}],"effort":[["Trace capture and reference runs",2],["KPI derivation",1.5],["Sensitivity study",1],["Precision and quantisation policy",1],["Suite packaging and handoff",0.5]],"entry":["Requirement register at v0.9 or better","Lab access to the previous-generation platform","NDA coverage for any customer-supplied model"],"exit":["Every KPI traces to a named workload and stated conditions","Workload suite runs end to end on the reference platform","Architecture has accepted the handoff as modellable"],"dependsOn":["DEF-01"],"dependsNote":null,"feedsInto":["DEF-03","DEF-05","DEF-07","ARCH-01","DV-09"],"measuredBy":["KPIs traceable to a workload","Workload suite runtime on the reference platform","Spread between the sensitivity study and the eventual ARCH-01 model"]},"DEF-03":{"stage":"productDefinition","window":[3,7],"criticalPath":true,"purpose":["Convert the KPI set into the three numbers the design is actually held to — <b>frequency, power envelope, die area</b> — and allocate them so every block owner inherits a share rather than a slogan.","An unallocated target is not a target. \"75 W board power\" binds nobody until it is decomposed into a die budget, a per-domain budget and a per-block budget with an owner against each. That decomposition is what makes an overrun visible in week 20 instead of week 60."],"steps":[{"n":1,"text":"Frequency target from the KPI set and expected IPC","tat":0.75,"lane":"main"},{"n":2,"text":"Power envelope decomposition — board, package, die, per-domain","tat":1,"lane":"main"},{"n":3,"text":"Die area budget from the block list and the reuse inventory","tat":1,"lane":"main"},{"n":4,"text":"Multi-Vt and operating voltage strategy, first pass","tat":0.5,"lane":"par"},{"n":5,"text":"PPA sensitivity against the candidate nodes","tat":0.75,"lane":"par"},{"n":6,"text":"Per-block allocation with a named owner against each budget","tat":0.75,"lane":"main"},{"n":7,"text":"Target review with architecture and physical design","tat":0.5,"lane":"main"}],"flowNote":"Allocation is the step that matters and it sits late, because it cannot start until the block list is stable. Steps 4 and 5 run in parallel with the budget work — both are inputs to the review rather than to the budgets themselves.","consumes":["KPI table from DEF-02","Block list and reuse inventory from the architecture sketch","Node PPA data from TECH-03","Previous-generation power and area actuals","Thermal and board constraints from the requirement register"],"produces":["Frequency target with the IPC assumption behind it","Power budget tree — board to per-domain","Die area budget by block","Voltage and multi-Vt strategy note","Per-block allocation sheet with owners"],"rel":[{"id":"DEF-D2","rel":"produces","text":"<b>Target specification — PPA and KPI table.</b> The PPA half of the deliverable. <code>DEF-02</code> supplies the KPI half; the two are published as one table."},{"id":"DEF-D4","rel":"feeds","text":"<b>Feasibility report.</b> These are the numbers <code>DEF-07</code> asks each candidate node to carry."},{"id":"DEF-D3","rel":"informs","text":"<b>Product cost and margin model.</b> The die area budget is the model's largest single input."}],"risks":["<b>Targets set from ambition rather than from the node.</b> A frequency target the library cannot reach turns into an eighteen-month argument that ends in a respin or a reduced bin.","<b>Power budget with no margin.</b> A budget allocated to 100% at definition has nothing left for the ECO storm at physical design, when power always grows.","<b>Area budget without the reuse inventory.</b> Budgets set before knowing which blocks are reused assign area to work that will not happen and starve work that will.","<b>Allocation without owners.</b> An unowned budget is a budget nobody defends, and it is spent by whoever moves first.","<b>Targets frozen before DEF-07 reports.</b> Feasibility can only return a verdict against targets; setting them beyond reach makes the verdict meaningless."],"roles":[{"r":"PPA lead","d":"Owns the budget tree and the allocation"},{"r":"Architect","d":"Frequency and IPC assumptions, block list"},{"r":"Power analyst","d":"Envelope decomposition and voltage strategy"},{"r":"Physical design liaison","d":"Reality-checks the frequency and area against the node"},{"r":"Stage lead","d":"Arbitrates when blocks contest the same budget"}],"effort":[["Frequency and power budgets",1],["Die area budget",0.75],["Node sensitivity",0.5],["Per-block allocation",0.5],["Review and arbitration",0.25]],"entry":["KPI table available from DEF-02","Block list stable enough to allocate against","At least two candidate nodes characterised by TECH-03"],"exit":["Frequency, power and area targets each carry a stated assumption","Every block has an allocated budget and a named owner","Architecture and physical design have signed the review"],"dependsOn":["DEF-02","DEF-05","TECH-03"],"dependsNote":null,"feedsInto":["DEF-04","DEF-07","ARCH-06","SYN-01","PD-09"],"measuredBy":["Share of the die budget allocated to a named owner","Margin held back against each budget","Delta between these targets and the ARCH-06 allocation"]},"DEF-04":{"stage":"productDefinition","window":[3,7],"criticalPath":false,"purpose":["Price the product <b>before anyone commits to building it</b>. Wafer, mask, package, test and yield fold into one model that says what the part costs at volume and whether the margin survives.","The cost model is also the veto. A design that meets every KPI and misses the cost ceiling is not a product, and the only cheap moment to discover that is here — while the die size is still an estimate rather than a floorplan."],"steps":[{"n":1,"text":"Die area estimate from the block list and the reuse inventory","tat":0.75,"lane":"main"},{"n":2,"text":"Wafer cost and gross die per wafer, per node candidate","tat":0.5,"lane":"main"},{"n":3,"text":"Defect density and yield model per node candidate","tat":1,"lane":"main"},{"n":4,"text":"Package and substrate cost — interposer, substrate layers, HBM stacks","tat":0.75,"lane":"par"},{"n":5,"text":"Test cost model — sort and final, with a test-time assumption","tat":0.5,"lane":"par"},{"n":6,"text":"Volume, ASP and margin roll-up","tat":1,"lane":"main"},{"n":7,"text":"Sensitivity — the three assumptions the model is most exposed to","tat":0.75,"lane":"main"}],"flowNote":"The sensitivity step is not optional decoration. A 2.5D part's cost is dominated by yield, interposer supply and HBM price, and each of those is an assumption rather than a quote at this point in the program.","consumes":["Die area budget from DEF-03","Wafer, mask and NRE quotations from TECH-04","Package architecture assumption from the requirement register","HBM and substrate price indications","Volume forecast and ASP from the segment sizing"],"produces":["Cost model workbook — wafer, package, test, yield","Gross die and yield curves per node candidate","Margin roll-up at the forecast volume","Sensitivity analysis on the three dominant assumptions","Cost ceiling statement for the design"],"rel":[{"id":"DEF-D3","rel":"produces","text":"<b>Product cost and margin model.</b> This activity is the deliverable — the workbook and its assumptions are handed over intact, not summarised."},{"id":"DEF-D4","rel":"feeds","text":"<b>Feasibility report.</b> A node that meets the PPA targets and breaks the cost ceiling is recorded as infeasible, and this model is what says so."},{"id":"DEF-D6","rel":"gates","text":"<b>Kickoff Go / No-Go decision record.</b> The funding decision is a margin decision. A model that does not close is a No-Go condition."}],"risks":["<b>Yield assumed from a mature node.</b> Defect density at a node in early ramp is not the number in the foundry's marketing chart, and the gap lands entirely in margin.","<b>Package cost treated as a rounding error.</b> On a 2.5D part with two HBM stacks the package can approach the die cost; modelling it as an adder hides the largest controllable line.","<b>Test cost with no test time.</b> Test cost is test time multiplied by tester rate; without a time assumption from DFT the line is decorative.","<b>Single-point ASP.</b> An ASP with no downside scenario turns the margin into a number nobody can be held to.","<b>Die size estimate carried without a tolerance.</b> An area estimate that later grows 15% moves gross die per wafer non-linearly, and the model reports it as a small change."],"roles":[{"r":"Product cost analyst","d":"Owns the model and its assumptions"},{"r":"Yield engineer","d":"Defect density and yield curves per node"},{"r":"Package cost liaison","d":"Interposer, substrate and HBM pricing"},{"r":"Test engineering liaison","d":"Test time and tester rate assumptions"},{"r":"Finance partner","d":"Volume, ASP and margin treatment"}],"effort":[["Yield model per node",1],["Cost roll-up and margin",0.75],["Package and test cost lines",0.75],["Sensitivity analysis",0.5]],"entry":["Die area budget available from DEF-03","Wafer and mask quotations received from TECH-04","Volume forecast agreed with sales"],"exit":["Cost model closes at the forecast volume with stated margin","Every assumption is named, sourced and dated","Sensitivity identifies the three exposures and their range"],"dependsOn":["DEF-01","DEF-03","TECH-04"],"dependsNote":null,"feedsInto":["DEF-07","DEF-09","TECH-04","MP-05"],"measuredBy":["Margin at forecast volume against the target","Share of model inputs backed by a quotation rather than an estimate","Cost delta carried by the sensitivity range"]},"DEF-05":{"stage":"productDefinition","window":[2,5],"criticalPath":false,"purpose":["Fix the bandwidth the workloads need at each level of the hierarchy, and turn that into <b>the interface count the package and the floorplan will have to carry</b>.","Bandwidth is where a specification becomes physical. Two HBM stacks rather than one is not a line in a document; it is a larger interposer, a different substrate, a bigger power envelope and a different cost model. Deciding it here is cheap and deciding it at architecture is not."],"steps":[{"n":1,"text":"Bandwidth demand per workload, from the DEF-02 traces","tat":0.75,"lane":"main"},{"n":2,"text":"Memory hierarchy sizing — on-die SRAM, HBM capacity and channels","tat":1,"lane":"main"},{"n":3,"text":"Host interface sizing — PCIe / CXL generation and lane count","tat":0.5,"lane":"par"},{"n":4,"text":"Die-to-die interface requirement, if a chiplet split is a candidate","tat":0.5,"lane":"par"},{"n":5,"text":"Translation into a pin and bump budget","tat":0.75,"lane":"main"},{"n":6,"text":"Requirement review with architecture and package","tat":0.5,"lane":"main"}],"flowNote":"Step 5 is the one that binds. Bandwidth stated in GB/s commits nobody; the same number stated as a bump count commits the floorplan, the package and the cost model at once.","consumes":["Workload traces and KPI table from DEF-02","Requirement register — capacity and latency requirements","HBM generation availability and roadmap","Interface standard revisions in flight (PCIe, CXL, UCIe)","Previous-generation bandwidth utilisation data"],"produces":["Bandwidth demand table, per workload and per hierarchy level","Memory configuration recommendation — capacity, stacks, channels","Host and die-to-die interface requirement","Pin and bump budget estimate","Review record with architecture and package"],"rel":[{"id":"DEF-D1","rel":"feeds","text":"<b>Product requirements document.</b> Bandwidth and capacity enter the PRD as requirements with numbers rather than as adjectives."},{"id":"DEF-D2","rel":"feeds","text":"<b>Target specification.</b> The bandwidth figures become KPI lines, and the bump budget becomes an area constraint on the PPA half."}],"risks":["<b>Bandwidth sized on peak rather than sustained.</b> Peak numbers size an interface nobody reaches and a cost nobody wanted.","<b>Capacity and bandwidth conflated.</b> HBM stack count is often set by capacity while the argument is conducted in GB/s; the two constraints do not move together.","<b>Interface standard still in revision.</b> Committing to a generation whose specification is not final transfers a standards-body schedule into the program's schedule.","<b>Bump budget never derived.</b> A bandwidth requirement that is not translated into bumps is discovered as a floorplan problem at <code>PD-04</code>, when the package is already ordered.","<b>Chiplet option left open too long.</b> A die-to-die interface is a large architectural commitment; deferring it past architecture freeze forces the conservative choice by default."],"roles":[{"r":"Memory systems architect","d":"Owns the hierarchy sizing and the bandwidth table"},{"r":"Interface architect","d":"Host and die-to-die interface selection"},{"r":"Workload analyst","d":"Sustained demand extraction from the traces"},{"r":"Package liaison","d":"Confirms the bump budget is buildable"},{"r":"Architecture liaison","d":"Takes the requirement into ARCH-03"}],"effort":[["Hierarchy sizing and bandwidth analysis",1],["Interface sizing",0.5],["Bump budget translation and review",0.5]],"entry":["Workload traces available from DEF-02","Requirement register carries capacity and latency requirements","HBM and interface roadmaps available under NDA"],"exit":["Bandwidth stated as sustained, per workload, with conditions","Memory configuration and interface count recommended with a reason","Bump budget accepted as buildable by package"],"dependsOn":["DEF-01","DEF-02"],"dependsNote":null,"feedsInto":["DEF-03","ARCH-03","ARCH-04","PKGD-02"],"measuredBy":["Bandwidth headroom against sustained demand","Bump budget against the package's stated capability","Interface revisions still open at architecture freeze"]},"DEF-06":{"stage":"productDefinition","window":[0,4],"criticalPath":false,"purpose":["Establish where the part lands <b>against what will be shipping when it ships</b> — not against what ships today.","A benchmark against the current generation is a comfortable exercise and a useless one. The program's silicon arrives thirty months out; the comparison that matters is against the parts that will be launching in that window, projected from public roadmaps and node cadence."],"steps":[{"n":1,"text":"Competitor set definition and launch-window mapping","tat":0.5,"lane":"main"},{"n":2,"text":"Public benchmark, datasheet and disclosure collection","tat":1,"lane":"main"},{"n":3,"text":"Normalisation to comparable metrics and conditions","tat":1,"lane":"par"},{"n":4,"text":"Projection to our own launch window","tat":1,"lane":"main"},{"n":5,"text":"Positioning statement and capability gap list","tat":1,"lane":"main"},{"n":6,"text":"Review with product and sales","tat":0.5,"lane":"main"}],"flowNote":"Normalisation runs in parallel because it is slow, thankless and independent of collection — vendors quote TOPS at different precisions, batch sizes and power points, and none of the published numbers compare until they are restated.","consumes":["Competitor datasheets, disclosures and conference material","Public benchmark submissions (MLPerf and equivalents)","Foundry node cadence and process roadmaps","Analyst launch forecasts","Field intelligence from sales"],"produces":["Competitor set with launch-window estimates","Normalised comparison table with stated conditions","Projection of the competitive field at our launch","Positioning statement","Capability gap list, ranked"],"rel":[{"id":"DEF-D1","rel":"feeds","text":"<b>Product requirements document.</b> The gap list becomes requirements — a gap nobody writes down is a gap nobody closes."},{"id":"DEF-D3","rel":"informs","text":"<b>Product cost and margin model.</b> Competitive positioning is what an ASP assumption is defended with."}],"risks":["<b>Benchmarking against today's field.</b> The comparison that decides the product is against parts launching thirty months out, and those numbers have to be projected rather than read.","<b>Vendor numbers taken at face value.</b> TOPS quoted at a precision, batch size and power point chosen to flatter is not a comparable number until it is restated.","<b>Gap list with no owner.</b> A capability gap that does not become a requirement is an observation, and observations do not change silicon.","<b>Positioning built on a single axis.</b> A part positioned only on TOPS/W loses to one positioned on total cost of ownership, and the argument is not had until launch.","<b>Competitor launch dates treated as fixed.</b> A slip in the competitive field is as consequential as a slip in ours, and neither is knowable to a quarter."],"roles":[{"r":"Product marketing lead","d":"Owns the competitor set and the positioning"},{"r":"Performance analyst","d":"Normalisation and projection"},{"r":"Technology analyst","d":"Node cadence and roadmap reading"},{"r":"Sales liaison","d":"Field intelligence and account-level reality"},{"r":"Stage lead","d":"Turns the gap list into requirements"}],"effort":[["Collection and competitor set",0.75],["Normalisation and projection",0.75],["Positioning and gap list",0.5]],"entry":["Product concept defined well enough to name a competitor set","Access to analyst material and benchmark submissions","Launch-window assumption from the program schedule"],"exit":["Every comparison is normalised to stated conditions","Field projected to our launch window, not read from today","Gap list handed to DEF-01 as candidate requirements"],"dependsOn":["DEF-01"],"dependsNote":null,"feedsInto":["DEF-01","DEF-04","DEF-09"],"measuredBy":["Competitors covered against the expected launch field","Share of comparisons normalised rather than quoted","Gaps converted into tracked requirements"]},"DEF-07":{"stage":"productDefinition","window":[4,8],"criticalPath":true,"purpose":["Test the requirement set, the PPA targets and the cost model against real nodes and return a verdict: <b>buildable as specified, buildable with named concessions, or not buildable</b>.","Feasibility is the only activity in the stage whose output can be \"no\". Its value is entirely in being allowed to say so — a feasibility study run after the node is chosen and the budget is committed is a formality, and formalities do not stop programs that should be stopped."],"steps":[{"n":1,"text":"Candidate node shortlist agreed with TECH","tat":0.5,"lane":"main"},{"n":2,"text":"PPA achievability per node — density, frequency, leakage","tat":1.25,"lane":"main"},{"n":3,"text":"IP availability check per node, ahead of IPR","tat":0.75,"lane":"par"},{"n":4,"text":"Cost model re-run per node","tat":0.5,"lane":"par"},{"n":5,"text":"Package and thermal feasibility at the target power","tat":0.75,"lane":"main"},{"n":6,"text":"Concession list — what must be given up, per node","tat":0.75,"lane":"main"},{"n":7,"text":"Verdict and recommendation","tat":0.75,"lane":"main"}],"flowNote":"The concession list is the deliverable that gets used. A binary verdict tells the decision room nothing it can act on; a list saying \"this node, at 200 MHz less, with the PHY bought rather than built\" is a decision it can take.","consumes":["Requirement register from DEF-01","PPA targets from DEF-03","Cost model from DEF-04","Node characterisation and DTCO study from TECH-03","IP availability indications from vendors and internal inventory"],"produces":["Node-by-node achievability matrix","IP availability finding per node","Thermal and package feasibility note","Concession list per node","Feasibility verdict with a named recommendation"],"rel":[{"id":"DEF-D4","rel":"produces","text":"<b>Feasibility report.</b> This activity is the deliverable. The verdict, the matrix and the concession list are published together — the verdict alone is not usable."},{"id":"DEF-D6","rel":"gates","text":"<b>Kickoff Go / No-Go decision record.</b> A No-Go recommendation here is the only mechanism in the stage that stops the program, and it must reach the room unedited."}],"risks":["<b>Feasibility run after the node is already chosen.</b> The study then documents a decision rather than informing one, and its independence is gone.","<b>Optimism at the boundary.</b> A target reachable \"with aggressive closure\" is a target reachable in a slide and not in a timing report.","<b>IP availability taken from the vendor's roadmap.</b> A block promised on the node and not yet ported is a schedule risk being recorded as an asset.","<b>Thermal checked at typical rather than at the envelope.</b> Feasibility at average power says nothing about the part at its rated envelope, which is the condition it is sold at.","<b>No concession list.</b> A bare yes or no gives the decision room no third option, and the third option is usually the right one."],"roles":[{"r":"Feasibility lead","d":"Owns the verdict and the concession list"},{"r":"PPA analyst","d":"Achievability per node against the DEF-03 targets"},{"r":"IP strategist","d":"Availability and porting status per node"},{"r":"Thermal and package liaison","d":"Feasibility at the rated power envelope"},{"r":"Stage lead","d":"Carries the recommendation into the gate"}],"effort":[["PPA achievability per node",1],["IP and cost checks",0.75],["Package and thermal feasibility",0.5],["Concession list and verdict",0.75]],"entry":["PPA targets published by DEF-03","Cost model closing in DEF-04","At least two nodes characterised by TECH-03"],"exit":["Every target has an achievability finding per candidate node","Concessions named and costed, not described","Verdict recorded with a recommendation and a dissent record"],"dependsOn":["DEF-01","DEF-03","DEF-04","TECH-03"],"dependsNote":null,"feedsInto":["DEF-09","TECH-01","ARCH-01","IPR-03"],"measuredBy":["Targets assessed against every candidate node","Concessions accepted at the gate against those raised","Findings later contradicted by ARCH-01 modelling"]},"DEF-08":{"stage":"productDefinition","window":[4,8],"criticalPath":false,"purpose":["Turn the milestone profile into a dated plan for <b>this</b> program, and say what it takes in people — then set that against the people who actually exist.","A schedule that assumes a headcount curve the organisation cannot staff is not a plan; it is a forecast of a slip. The value of this activity is the comparison, not the Gantt chart: effort rolled up by stage and discipline, against the capacity on hand."],"steps":[{"n":1,"text":"Profile selection and kickoff date","tat":0.5,"lane":"main"},{"n":2,"text":"Stage baseline adjustment for this program's scope","tat":0.75,"lane":"main"},{"n":3,"text":"Effort roll-up by stage and by discipline","tat":1,"lane":"main"},{"n":4,"text":"Headcount curve set against the organisation's real capacity","tat":1,"lane":"main"},{"n":5,"text":"External lead-time overlay — substrate, probe card, IP, shuttle","tat":0.75,"lane":"par"},{"n":6,"text":"Risk buffer placement and critical path identification","tat":0.75,"lane":"main"},{"n":7,"text":"Schedule review and commitment","tat":0.5,"lane":"par"}],"flowNote":"The lead-time overlay runs in parallel and changes more dates than the internal plan does. A twenty-week probe card and a twenty-week substrate are ordered against dates this activity sets, and both sit outside the organisation's control once placed.","consumes":["Milestone profile and stage baselines","Effort figures per activity from the template","Organisation capacity and current program commitments","Supplier lead times — substrate, interposer, probe card, IP, shuttle","Feasibility concessions from DEF-07"],"produces":["Program schedule with dated stage boundaries and milestones","Effort roll-up by stage and discipline","Headcount curve against available capacity","Lead-time overlay and order-by dates","Critical path and buffer placement record"],"rel":[{"id":"DEF-D5","rel":"produces","text":"<b>Program charter, staffing and budget plan.</b> The schedule, the headcount curve and the effort roll-up are the charter's operative content."},{"id":"DEF-D6","rel":"gates","text":"<b>Kickoff Go / No-Go decision record.</b> The gate approves a schedule and a headcount. An unresourced plan is a No-Go condition."}],"risks":["<b>Headcount curve nobody can staff.</b> A peak of 200 engineers in a 120-engineer organisation is a slip already committed to, recorded as a plan.","<b>Template baselines used unadjusted.</b> The profile describes a typical program; a derivative or a first-of-node program is not typical, and the deltas belong in the plan.","<b>Lead times discovered rather than planned.</b> Probe card and substrate lead times run to twenty weeks; found late they move wafer-out, not the purchasing date.","<b>Buffer at the end.</b> A buffer placed after the last stage protects nothing; buffers belong in front of the gates that cannot move.","<b>Critical path asserted rather than derived.</b> On a 23-stage profile with parallel enablement workstreams the critical path is rarely the design spine, and assuming it is misdirects the attention that matters."],"roles":[{"r":"Program manager","d":"Owns the schedule, the buffers and the critical path"},{"r":"Resource manager","d":"Capacity, headcount curve and hiring plan"},{"r":"Discipline leads","d":"Confirm the effort roll-up for their stages"},{"r":"Procurement liaison","d":"Supplier lead times and order-by dates"},{"r":"Finance partner","d":"Converts effort into budget"}],"effort":[["Effort roll-up by stage and discipline",1],["Headcount curve against capacity",0.75],["Lead-time overlay",0.5],["Buffer and critical path",0.5],["Review and commitment",0.25]],"entry":["Milestone profile selected","Scope stable enough to adjust baselines against","Organisation capacity data available"],"exit":["Schedule dated from a committed kickoff","Headcount curve reconciled against real capacity, gaps named","Critical path derived and buffers placed against the fixed gates"],"dependsOn":["DEF-01","DEF-07"],"dependsNote":null,"feedsInto":["DEF-09","TECH-05","IPR-09","TEST-02","PKGD-09"],"measuredBy":["Peak headcount against available capacity","Buffer weeks held in front of fixed gates","Long-lead items with an order-by date on the plan"]},"DEF-09":{"stage":"productDefinition","window":[5,8],"criticalPath":true,"purpose":["Assemble what the stage produced into <b>the case the funding decision is made on</b>, and put a named recommendation in front of the people who can say no.","This activity writes nothing new. Its work is selection and honesty: the feasibility verdict, the cost model and the resourced schedule carried into the room intact, with the downside scenario shown rather than described. A business case that only closes in the base case has not been reviewed."],"steps":[{"n":1,"text":"Financial model assembly — NRE, opex, revenue, breakeven","tat":1,"lane":"main"},{"n":2,"text":"Scenario set — base, downside, upside","tat":0.75,"lane":"par"},{"n":3,"text":"Risk register summary written for the decision room","tat":0.5,"lane":"main"},{"n":4,"text":"Recommendation and the ask, stated as a number","tat":0.5,"lane":"main"},{"n":5,"text":"Executive review pack","tat":0.75,"lane":"main"},{"n":6,"text":"Decision meeting and record","tat":0.25,"lane":"main"}],"flowNote":"The decision meeting is a quarter of a week and the preparation is three weeks, which is the correct ratio. A gate that is argued in the room rather than before it is a gate whose outcome depends on who attends.","consumes":["Cost and margin model from DEF-04","Feasibility verdict and concession list from DEF-07","Resourced schedule and headcount curve from DEF-08","Positioning and gap list from DEF-06","Program risk register"],"produces":["Financial model — NRE, opex, revenue, breakeven","Scenario set with the downside made explicit","Risk summary for the decision room","Recommendation with a stated ask","Decision record with owners, conditions and dissent"],"rel":[{"id":"DEF-D6","rel":"produces","text":"<b>Kickoff Go / No-Go decision record.</b> This activity is the deliverable — the record, its conditions and its dissent, not the slides that preceded it."},{"id":"DEF-D5","rel":"feeds","text":"<b>Program charter, staffing and budget plan.</b> The charter is only funded once this decision lands; the approved figure is written back into it."}],"risks":["<b>Base case only.</b> A case that closes at forecast volume and is never shown at downside volume transfers the risk to whoever inherits the program.","<b>Conditions accepted verbally.</b> A Go granted \"subject to\" something nobody wrote down is a Go, and the condition is never revisited.","<b>Dissent unrecorded.</b> The objection nobody minuted is the objection that resurfaces at first silicon with nothing to point at.","<b>Feasibility concessions edited on the way to the room.</b> A concession list softened in the pack is the one failure mode that makes the whole stage worthless.","<b>Decision owners unclear.</b> A gate where nobody is identified as able to say no is a gate that cannot say no."],"roles":[{"r":"Program manager","d":"Owns the pack, the ask and the record"},{"r":"Finance partner","d":"Financial model and scenario set"},{"r":"Product lead","d":"Revenue, positioning and the market case"},{"r":"Stage lead","d":"Carries the feasibility verdict unedited"},{"r":"Executive sponsor","d":"Chairs the decision and owns the outcome"}],"effort":[["Financial model assembly",0.75],["Scenario set",0.5],["Review pack",0.5],["Decision meeting and record",0.25]],"entry":["Cost model closed by DEF-04","Feasibility verdict issued by DEF-07","Resourced schedule available from DEF-08"],"exit":["Case shown at base and downside, not base alone","Decision recorded with named owners, conditions and dissent","Approved budget written back into the program charter"],"dependsOn":["DEF-04","DEF-06","DEF-07","DEF-08"],"dependsNote":null,"feedsInto":["ARCH-01","TECH-06","IPR-07"],"measuredBy":["Scenarios presented against those prepared","Conditions attached to the decision and their owners","Days from pack circulation to decision"]}}};
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const wk = n => (n === 0.5 ? '½w' : n + 'w');
const has = id => Object.prototype.hasOwnProperty.call(D.details, id);
const findAct = id => { for (const s of D.stages) { const a = s.activities.find(x => x.id === id); if (a) return {a, s}; } return null; };
const ALL = D.stages.flatMap(s => s.activities.map(a => a.id));
let current = null, onlyWritten = false, query = '';

/* ---------- nav ---------- */
function renderNav(){
  const q = query.trim().toLowerCase();
  let h = '';
  for (const s of D.stages) {
    const acts = s.activities.filter(a =>
      (!onlyWritten || has(a.id)) &&
      (!q || a.id.toLowerCase().includes(q) || a.text.toLowerCase().includes(q)));
    if (!acts.length) continue;
    const n = s.activities.filter(a => has(a.id)).length;
    h += `<div class="nav-stage${n === s.activities.length ? ' full' : ''}">
      <span>${String(s.n).padStart(2,'0')} · ${esc(s.code)}</span>
      <span class="cnt">${n}/${s.activities.length}</span></div>`;
    for (const a of acts)
      h += `<button class="nav-a${has(a.id) ? ' has' : ''}" data-go="${a.id}"
        ${current === a.id ? 'aria-current="true"' : ''} ${has(a.id) ? '' : 'disabled'}>
        <span class="id">${a.id}</span><span>${esc(a.text)}</span></button>`;
  }
  document.getElementById('list').innerHTML = h || '<p class="ad-none" style="padding:20px 18px">Nothing matches.</p>';
}

/* ---------- detail ---------- */
function renderDetail(id){
  const pane = document.getElementById('pane');
  if (!id || !has(id)) {
    pane.innerHTML = `<div class="empty"><p>Pick an activity on the left. Entries that are not yet written are dimmed —
      ${D.authoredCount} of ${ALL.length} are done so far.</p></div>`;
    return;
  }
  const d = D.details[id], {a, s} = findAct(id);
  const span = d.window[1] - d.window[0];
  const fte = (a.mm * 4.345 / Math.abs(a.tat)).toFixed(1);
  const pos = w => ((w - d.window[0]) / span * 100);
  const lanes = ['main','par'];
  let cursor = {main: d.window[0], par: d.window[0]};
  const placed = d.steps.map(st => { const l = st.lane; const x = cursor[l]; cursor[l] = x + st.tat; return {st, x}; });
  const ticks = []; for (let w = d.window[0]; w <= d.window[1] + 0.001; w += span <= 4 ? 1 : Math.ceil(span/5)) ticks.push(w);
  if (ticks[ticks.length-1] !== d.window[1]) ticks.push(d.window[1]);

  const idx = ALL.filter(has).indexOf(id);
  const written = ALL.filter(has);

  pane.innerHTML = `<div class="pane-inner">
    <div class="ad-head">
      <span class="ad-id">${id}</span>
      <h2>${esc(a.text)}</h2>
      <span class="spacer"></span>
      <span class="ad-crumb">${String(s.n).padStart(2,'0')} ${esc(s.code)} · ${esc(s.name)} · stage w${s.start}–${s.start + s.dur}</span>
      <span class="ad-nav">
        <button data-go="${written[(idx - 1 + written.length) % written.length]}">←</button>
        <button data-go="${written[(idx + 1) % written.length]}">→</button>
      </span>
    </div>

    <div class="ad-facts">
      <div class="ad-fact"><span class="k">TAT</span><span class="v">${wk(Math.abs(a.tat))}</span><span class="d">w${d.window[0]}–w${d.window[1]} in stage</span></div>
      <div class="ad-fact"><span class="k">Effort</span><span class="v">${a.mm.toFixed(1)} <small>M/M</small></span><span class="d">planned</span></div>
      <div class="ad-fact"><span class="k">Implied team</span><span class="v">~${fte} <small>FTE</small></span><span class="d">while it runs</span></div>
      <div class="ad-fact"><span class="k">Steps</span><span class="v">${d.steps.length}</span><span class="d">${d.steps.filter(x=>x.lane==='par').length} run in parallel</span></div>
      <div class="ad-fact"><span class="k">Critical path</span><span class="v">${d.criticalPath ? 'yes' : 'no'}</span><span class="d">${d.criticalPath ? 'no float' : 'has float'}</span></div>
      <div class="ad-fact"><span class="k">Owner</span><span class="v" style="font-size:.76em">${esc(d.roles[0].r)}</span><span class="d">${esc(d.roles[d.roles.length-1].r)} approves</span></div>
    </div>

    <div class="ad-grid">
      <div>
        <section class="ad-sec"><span class="cap">Purpose</span>
          ${d.purpose.map(p => '<p class="ad-lede">' + p + '</p>').join('')}
        </section>

        <section class="ad-sec">
          <span class="cap">Work flow <span class="n">${d.steps.length} steps · ${d.steps.some(x=>x.lane==='par') ? '2 lanes' : '1 lane'}</span></span>
          <div class="ad-flow">
            <div class="ad-axis">${ticks.map(w => '<span style="left:' + pos(w).toFixed(1) + '%">w' + w + '</span>').join('')}</div>
            ${lanes.filter(l => d.steps.some(x => x.lane === l)).map(l => `
              <p class="ad-lane-tag">${l === 'main' ? 'Main sequence' : 'In parallel'}</p>
              <div class="ad-lane">${placed.filter(p => p.st.lane === l).map(p =>
                '<span class="ad-step' + (l === 'par' ? ' par' : '') + '" style="left:' + pos(p.x).toFixed(2) + '%;width:' + (p.st.tat / span * 100).toFixed(2) + '%" title="' + esc(p.st.text) + '"><b>' + p.st.n + '</b></span>').join('')}</div>`).join('')}
          </div>
          <div class="ad-steps-head"><span>#</span><span>Step</span><span>TAT</span><span>Lane</span></div>
          <ul class="ad-steps">${d.steps.map(st =>
            '<li><span class="n">' + st.n + '</span><span>' + esc(st.text) + '</span><span class="w">' + wk(st.tat) +
            '</span><span class="lane' + (st.lane==='par'?' par':'') + '">' + (st.lane==='par'?'parallel':'main') + '</span></li>').join('')}</ul>
          ${d.flowNote ? '<p class="ad-note">' + esc(d.flowNote) + '</p>' : ''}
        </section>

        <section class="ad-sec"><span class="cap">Inputs and working artifacts</span>
          <div class="ad-io">
            <div><h4>Consumes</h4><ul class="ad-list">${d.consumes.map(x => '<li>' + esc(x) + '</li>').join('')}</ul></div>
            <div><h4>Produces</h4><ul class="ad-list">${d.produces.map(x => '<li>' + esc(x) + '</li>').join('')}</ul></div>
          </div>
          <p class="ad-note">Working artifacts are how the activity carries its own work. They are not the stage's key deliverables — how the two relate is below.</p>
        </section>

        <section class="ad-sec"><span class="cap">Relationship to the stage's key deliverables</span>
          <ul class="ad-rel">${d.rel.map(r => {
            const t = (s.deliverables.find(x => x.id === r.id) || {}).title || '';
            return '<li><span class="did">' + r.id + '</span><span class="rel ' + r.rel + '">' + r.rel +
              '</span><span class="txt">' + r.text + '</span></li>';
          }).join('')}</ul>
        </section>

        <section class="ad-sec"><span class="cap">Risks and watch-outs</span>
          <ul class="ad-risks">${d.risks.map(x => '<li><span>' + x + '</span></li>').join('')}</ul>
        </section>
      </div>

      <aside class="ad-side">
        <section><span class="cap">At a glance</span><div class="ad-kv">
          <div><span class="k">Activity</span><span class="v">${id}</span></div>
          <div><span class="k">Stage</span><span class="v">${String(s.n).padStart(2,'0')} · ${s.code}</span></div>
          <div><span class="k">Window</span><span class="v">w${d.window[0]} – w${d.window[1]}</span></div>
          <div><span class="k">TAT</span><span class="v">${wk(Math.abs(a.tat))}</span></div>
          <div><span class="k">Effort</span><span class="v">${a.mm.toFixed(1)} M/M</span></div>
          <div><span class="k">Implied team</span><span class="v">~${fte} FTE</span></div>
          <div><span class="k">Steps</span><span class="v">${d.steps.length} · ${d.steps.filter(x=>x.lane==='par').length} parallel</span></div>
          <div><span class="k">Continuous</span><span class="v">${a.cont ? 'yes' : 'no'}</span></div>
          <div><span class="k">On critical path</span><span class="v">${d.criticalPath ? 'yes' : 'no'}</span></div>
        </div></section>

        <section><span class="cap">Effort split <span class="n">${a.mm} M/M</span></span><div class="ad-split">
          ${d.effort.map(([l, v]) => '<div><span>' + esc(l) + '</span><span class="mm">' + v.toFixed(1) + '</span></div>').join('')}
          <div><span>Total</span><span class="mm">${d.effort.reduce((n,[,v])=>n+v,0).toFixed(1)}</span></div>
        </div></section>

        <section><span class="cap">Who it takes <span class="n">~${fte} FTE</span></span><div class="ad-roles">
          ${d.roles.map(r => '<div><b>' + esc(r.r) + '</b>' + esc(r.d) + '</div>').join('')}
        </div></section>

        <section><span class="cap">Entry criteria</span><ul class="ad-list ad-crit">${d.entry.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></section>
        <section><span class="cap">Exit criteria</span><ul class="ad-list ad-crit">${d.exit.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></section>

        <section><span class="cap">Depends on</span>
          ${d.dependsOn.length
            ? '<div class="ad-chain">' + d.dependsOn.map(x => '<button data-go="' + x + '"' + (has(x)?'':' class="dead" disabled') + ' title="' + esc((findAct(x)||{a:{text:''}}).a.text) + '">' + x + '</button>').join('') + '</div>'
            : '<p class="ad-none">' + esc(d.dependsNote || 'Nothing upstream.') + '</p>'}
        </section>

        <section><span class="cap">Feeds into</span><div class="ad-chain">
          ${d.feedsInto.map(x => '<button data-go="' + x + '"' + (has(x)?'':' class="dead" disabled') + ' title="' + esc((findAct(x)||{a:{text:'not in template'}}).a.text) + '">' + x + '</button>').join('')}
        </div></section>

        <section><span class="cap">Measured by</span><ul class="ad-list">${d.measuredBy.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></section>
      </aside>
    </div>
  </div>`;
  pane.scrollTop = 0;
}

D.authoredCount = Object.keys(D.details).length;
document.getElementById('tally').textContent =
  D.authoredCount + ' of ' + ALL.length + ' activities written · ' + D.stages.length + ' stages';

function go(id){ if (!has(id)) return; current = id; location.hash = id; renderNav(); renderDetail(id); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b && !b.disabled) go(b.dataset.go);
});
document.getElementById('q').addEventListener('input', e => { query = e.target.value; renderNav(); });
const bAll = document.getElementById('f-all'), bHas = document.getElementById('f-has');
const setF = v => { onlyWritten = v; bAll.setAttribute('aria-pressed', String(!v)); bHas.setAttribute('aria-pressed', String(v)); renderNav(); };
bAll.onclick = () => setF(false); bHas.onclick = () => setF(true);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && has(h) && h !== current) go(h); });

const start = location.hash.slice(1);
current = has(start) ? start : Object.keys(D.details)[0];
renderNav(); renderDetail(current);
</script>
</body>
</html>
